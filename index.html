Object.assign(LECC[0],{min:15,html:`<p>Escribir no es transcribir lo que ya pensaste: es <b>pensar a través de las palabras</b>. Cada frase es una decisión, y el oficio consiste en tomar esas decisiones con intención.</p><h3>Tres ideas fundacionales</h3><ol><li><b>La escritura es elección.</b> Decides qué contar y, sobre todo, qué callar. Lo que omites define tanto la obra como lo que muestras.</li><li><b>La claridad antes que el adorno.</b> Una idea clara en lenguaje sencillo vale más que tres ideas difusas envueltas en adjetivos.</li><li><b>La emoción es el destino.</b> El lector no recuerda tramas: recuerda lo que sintió al leerlas.</li></ol><h3>Escribir es reescribir</h3><p>Nadie escribe bien a la primera. El borrador sirve para descubrir qué quieres decir; la revisión, para decirlo con precisión. Separa los dos momentos: primero escribe sin juzgar, después corrige sin piedad. Mezclarlos es la forma más segura de bloquearse.</p><h3>Escribir para alguien</h3><p>Todo texto tiene un lector, aunque sea imaginario. Antes de empezar, pregúntate quién va a leerlo, qué sabe ya y qué quieres que sienta al terminar. Esa imagen decide el tono, el vocabulario y lo que puedes omitir.</p><h3>Qué distingue a un texto vivo</h3><ul><li><b>Intención:</b> sabes qué quiere provocar cada párrafo.</li><li><b>Concreción:</b> prefiere «un tranvía amarillo» a «un vehículo».</li><li><b>Voz:</b> suena a alguien, no a nadie.</li></ul><h3>La silla y la página</h3><p>El primer hábito del escritor no es la inspiración, sino la constancia. Reserva un tiempo, siéntate y escribe aunque no sepas qué decir. La página en blanco se vence escribiéndola.</p><blockquote>Escribir es fácil: solo hay que sentarse a trabajar.</blockquote><p>En las próximas lecciones aprenderás las herramientas para que esa práctica se convierta en literatura.</p>`,qs:[...LECC[0].qs,{q:'¿Por qué conviene separar escribir de corregir?',o:['Porque juzgar mientras escribes bloquea y mezcla dos tareas distintas','Porque corregir no hace falta','Porque el borrador debe salir perfecto'],a:0,w:'Primero se descubre lo que se quiere decir; después se pule.'}]});
Object.assign(LECC[1],{min:16,html:`<p>La frase es la unidad mínima de la prosa; el párrafo, su respiración. Dominarlos es dominar el ritmo.</p><h3>La frase: una idea, una intención</h3><p>Una frase corta golpea; una larga envuelve. Alterna según lo que quieras que sienta el lector, y procura que cada frase lleve una sola idea principal: si necesitas tres «que» seguidos, probablemente son dos frases.</p><h3>Quién hace qué</h3><p>Las frases más fuertes ponen pronto al que actúa y lo que hace. Compara: «La puerta fue abierta por ella con lentitud» y «Ella abrió la puerta despacio». La segunda es más corta, más clara y más viva.</p><h3>El párrafo: una unidad de sentido</h3><p>Un párrafo organiza una idea o un momento. Empieza otro cuando cambia el tema, el tiempo, el lugar o quien habla. Los párrafos muy largos cansan; una cadena de párrafos de una sola línea fragmenta y suena a titular.</p><h3>Tres revisiones rápidas</h3><ol><li>Lee en voz alta: donde te quedes sin aire, corta.</li><li>Elimina las palabras que no cambian el sentido.</li><li>Cuida la puntuación: es el ritmo escrito.</li></ol><h3>Errores comunes</h3><ul><li>Frases kilométricas con subordinadas sin fin.</li><li>Empezar muchas frases con la misma palabra.</li><li>Usar tres adjetivos donde uno exacto bastaría.</li></ul><blockquote>La puntuación es la respiración del texto.</blockquote>`,qs:[...LECC[1].qs,{q:'¿Cuál es más clara y directa?',o:['La puerta fue abierta por ella con lentitud.','Ella abrió la puerta despacio.','Fue abierta la puerta, lentamente, por ella.'],a:1,w:'Poner pronto al que actúa vuelve la frase más viva.'}]});
Object.assign(LECC[2],{min:17,html:`<p>Contar resume; mostrar escenifica. Cuando muestras, el lector deduce y siente por sí mismo.</p><h3>La diferencia</h3><p><i>Contar:</i> «Estaba nervioso». <i>Mostrar:</i> se secó las manos en el pantalón por tercera vez.</p><h3>Cómo mostrar</h3><ol><li>Usa acciones y gestos concretos.</li><li>Apela a los cinco sentidos.</li><li>Deja que el diálogo y los objetos revelen.</li></ol><h3>El detalle revelador</h3><p>No hace falta describirlo todo: un solo detalle bien elegido sugiere el resto. Una taza con la marca de un labial viejo cuenta una ausencia mejor que un párrafo de explicación.</p><h3>Cuándo contar</h3><p>Contar sirve para pasar rápido por lo poco importante: «Pasaron tres meses». Muestra los momentos clave; cuenta las transiciones.</p><h3>Dos errores opuestos</h3><ul><li><b>Contar lo importante:</b> el lector recibe el dato, pero no la emoción.</li><li><b>Mostrarlo todo:</b> si escenificas hasta lo trivial, la historia avanza a paso de tortuga.</li></ul><blockquote>No digas que el hielo era frío: haz que el lector sienta cómo le duelen los dedos.</blockquote>`,qs:[...LECC[2].qs,{q:'¿Qué conviene hacer con los momentos poco importantes?',o:['Contarlos rápido y reservar la escena para lo clave','Escenificarlos todos','Eliminarlos siempre'],a:0,w:'Mostrar y contar se reparten según la importancia del momento.'}]});
const L11=L('l11',0,13,'Hábitos y proceso: escribir de forma constante','Cómo construir un proceso estable: hábito, etapas, bloqueo y material.',['estilo y voz','estructura narrativa'],`<p>El talento ayuda, pero lo que separa a quien escribe de quien solo quiere escribir es el proceso: una forma de trabajar que se repite incluso cuando no hay ganas.</p><h3>El hábito mínimo</h3><p>Elige una cantidad ridículamente pequeña (diez minutos o cien palabras) y cúmplela todos los días. La constancia pesa más que las maratones: un hábito pequeño sobrevive a los días malos; uno heroico se rompe el primero.</p><h3>Las cuatro etapas del proceso</h3><ol><li><b>Idea:</b> anota sin juzgar; una libreta o una nota del móvil bastan.</li><li><b>Planificación:</b> decide el final aproximado, los personajes y el conflicto; no hace falta un plan rígido.</li><li><b>Borrador:</b> escribe hasta el final sin volver atrás.</li><li><b>Revisión:</b> relee en frío, corta, reordena y pule.</li></ol><h3>Cómo vencer el bloqueo</h3><p>Casi siempre es miedo a escribir mal. Rebaja la exigencia: permítete escribir el peor párrafo posible, cambia de escena, o termina la sesión a mitad de una frase para tener por dónde arrancar mañana.</p><h3>Recoger material</h3><p>Observa y anota: una frase oída en la calle, un gesto, un olor. Lo concreto se escribe mejor que lo inventado de la nada.</p><h3>Medir el avance</h3><p>Registra palabras o minutos, no calidad. La calidad se evalúa en la revisión; el avance, en la constancia.</p><blockquote>Se escribe un poco cada día, o no se escribe.</blockquote>`,{t:'Plan de escritura semanal',d:'f',s:'Diseña tu rutina mínima.',c:'Escribe en 120 palabras tu plan para la próxima semana: cuándo escribirás, cuánto y qué harás si un día no tienes ganas.',min:100},[{q:'¿Por qué conviene un hábito mínimo?',o:['Porque sobrevive a los días malos','Porque produce textos perfectos','Porque no requiere tiempo'],a:0,w:'La constancia pesa más que las maratones.'},{q:'En el borrador conviene...',o:['Escribir hasta el final sin volver atrás','Corregir cada frase al escribirla','Esperar a tener ganas'],a:0,w:'Corregir mientras escribes frena y bloquea.'},{q:'Una forma útil de enfrentar el bloqueo es...',o:['Permitirte escribir el peor párrafo posible','Dejar de escribir una semana','Borrar todo lo anterior'],a:0,w:'Bajar la exigencia devuelve el movimiento.'}]);
LECC.push(L11);NODOS.splice(3,0,L11);NODOS.find(n=>n.id==='x1').ex=['l1','l2','l3','l11'];REL.l11=['m13','m7'];
LECC[2].html=LECC[2].html.replace('<blockquote>',`<h3>Un ejemplo comentado</h3><p><i>Antes:</i> «Ana estaba triste porque su padre se había ido.» <i>Después:</i> «Ana siguió poniendo tres platos en la mesa. Cuando se dio cuenta, retiró el tercero sin mirar la silla vacía.» La segunda versión no nombra la tristeza y sin embargo la hace sentir: hay una acción, un objeto y un silencio.</p><h3>Cómo practicarlo</h3><p>Toma una emoción y pregúntate qué haría el cuerpo, qué haría la mano y qué miraría el personaje. Escribe tres gestos posibles y quédate con el menos obvio.</p><blockquote>`);
LECC[1].html=LECC[1].html.replace('<blockquote>',`<h3>Un ejemplo: antes y después</h3><p><i>Antes:</i> «Cuando llegó a la casa, que era muy grande y que tenía un jardín que estaba lleno de flores, ella se quedó mirando porque no podía creer que fuera suya.» <i>Después:</i> «Llegó a la casa y se detuvo. Era enorme. En el jardín abundaban las flores. No podía creer que fuera suya.» Cuatro frases cortas respiran mejor que una larga y enmarañada.</p><h3>La regla del oído</h3><p>Si al leer en voz alta tropiezas, el lector también tropezará. Corta, reordena o elimina hasta que la frase fluya sin esfuerzo.</p><blockquote>`);
const ADD=(i,min,extra,q)=>{LECC[i].min=min;LECC[i].html=LECC[i].html.replace('<blockquote>',extra+'<blockquote>');LECC[i].qs=[...LECC[i].qs,q];};
ADD(3,20,`<h3>El arco de tensión</h3><p>Imagina la historia como una pendiente: cada obstáculo la hace más empinada hasta llegar al clímax. Después de ese punto, la tensión cae rápido en el desenlace; alargarlo demasiado apaga la historia.</p><h3>El detonante y el punto sin retorno</h3><p>El <b>detonante</b> es el suceso que rompe la normalidad y pone en marcha la trama. El <b>punto sin retorno</b> es el momento en que el personaje ya no puede volver atrás sin perderlo todo. Si ambos están claros, la estructura se sostiene sola.</p><h3>Diagnóstico rápido</h3><ul><li>¿Puedes resumir la historia en una frase con deseo, obstáculo y resultado?</li><li>¿Qué pasaría si quitaras el primer capítulo?</li><li>¿El final responde la pregunta que abrió el comienzo?</li></ul>`,{q:'¿Qué es el punto sin retorno?',o:['El momento en que el personaje ya no puede volver atrás sin perderlo todo','El final de la historia','La presentación del mundo'],a:0,w:'Desde ahí, la única salida es hacia adelante.'});
ADD(4,20,`<h3>Contradicciones que humanizan</h3><p>Un personaje coherente en todo es un personaje plano. Dale una contradicción: el avaro que regala el último pan, la valiente que teme a las escaleras. Esa grieta hace que el lector lo sienta real.</p><h3>Revelar sin explicar</h3><p>Mostrar quién es alguien a través de lo que elige bajo presión pesa más que describir su carácter. Una decisión difícil revela más que tres párrafos de biografía.</p><h3>Tres preguntas antes de escribir una escena</h3><ul><li>¿Qué quiere este personaje ahora mismo?</li><li>¿Qué teme perder?</li><li>¿Qué haría que cambiara de opinión?</li></ul>`,{q:'¿Cómo se revela mejor a un personaje?',o:['Con las decisiones que toma bajo presión','Con una biografía larga','Con un narrador que lo califica'],a:0,w:'Elegir cuando cuesta es lo que define a alguien.'});
ADD(5,18,`<h3>Cada personaje, una voz</h3><p>Si tapas los nombres y no distingues quién habla, falta voz. Varía el vocabulario, el largo de las frases y lo que cada uno evita decir.</p><h3>Interrupciones y silencios</h3><p>La gente real se interrumpe, cambia de tema y calla. Una intervención cortada, una pregunta sin respuesta o una pausa marcada con una acción pesan más que una réplica perfecta.</p><h3>Errores frecuentes</h3><ul><li>Diálogos que explican lo que ambos ya saben («Como sabes, hermano…»).</li><li>Etiquetas rebuscadas en lugar de «dijo».</li><li>Conversaciones sin conflicto: nadie quiere nada.</li></ul>`,{q:'¿Qué defecto tiene «Como sabes, hermano, nuestro padre murió hace un año»?',o:['Explica al lector lo que ambos ya saben','Usa demasiadas comas','Es demasiado corto'],a:0,w:'El diálogo no debe ser un informe para el lector.'});
ADD(6,19,`<h3>Intensidad y contención</h3><p>Cuanto más fuerte la emoción, menos adornos necesita. En el dolor, las frases se acortan y los detalles se vuelven concretos y casi triviales: la mano que busca las llaves mientras todo se derrumba.</p><h3>Contraste</h3><p>Una emoción se nota más cuando choca con el entorno: un funeral bajo un sol radiante, una buena noticia recibida en un pasillo vacío.</p><h3>Del cliché al detalle propio</h3><p>«Temblaba de miedo» es una etiqueta. «Contó las baldosas del pasillo para no mirar la puerta» es un personaje concreto sintiendo miedo.</p>`,{q:'¿Cómo suena una emoción muy intensa en la prosa?',o:['Con frases cortas y detalles concretos','Con adjetivos largos y adornos','Con una explicación del narrador'],a:0,w:'La contención hace más fuerte la emoción.'});
const L12=L('l12',1,18,'Escena y secuela: la unidad del relato','Cómo se construye una escena con conflicto y cómo la secuela procesa lo ocurrido y mueve la historia.',['estructura narrativa','tension y conflicto'],`<p>Una novela es una cadena de escenas. Si cada una funciona, la historia funciona; si una falla, el lector lo siente aunque no sepa explicarlo.</p><h3>Anatomía de una escena</h3><ol><li><b>Objetivo:</b> el personaje quiere algo concreto en esta escena.</li><li><b>Conflicto:</b> algo o alguien se interpone.</li><li><b>Desenlace:</b> el resultado, casi siempre un «no, y además…» o un «sí, pero…» que complica la situación.</li></ol><h3>La secuela: el respiro que mueve la historia</h3><p>Después de la acción, el personaje necesita procesar: reacciona emocionalmente, piensa sus opciones y decide el siguiente paso. La secuela da humanidad y prepara la escena siguiente; sin ella, los personajes parecen máquinas.</p><h3>Entrar tarde, salir temprano</h3><p>Empieza la escena lo más cerca posible del conflicto y termina en cuanto el cambio ocurre. Los saludos, los trayectos y las despedidas casi siempre sobran.</p><h3>La prueba del cambio</h3><p>Compara el estado del personaje al entrar y al salir. Si nada cambió (información, relación, ánimo, riesgo), la escena no está trabajando.</p><h3>Errores comunes</h3><ul><li>Escenas sin objetivo: pasan cosas, pero nadie quiere nada.</li><li>Conflictos que se resuelven demasiado fácil.</li><li>Secuelas interminables que frenan el ritmo.</li></ul><blockquote>Cada escena debe dejar el mundo del personaje un poco distinto.</blockquote>`,{t:'Una escena completa',d:'m',s:'Escribe una escena con objetivo, conflicto y desenlace.',c:'Escribe una escena de 200 palabras: un personaje quiere algo concreto, alguien se opone y el resultado complica su situación. Cierra con una secuela breve de dos o tres frases.',min:180},[{q:'¿Qué tres elementos tiene una escena?',o:['Objetivo, conflicto y desenlace','Inicio, nudo y moraleja','Descripción, diálogo y final'],a:0,w:'Sin objetivo y conflicto no hay escena.'},{q:'¿Para qué sirve la secuela?',o:['Para que el personaje procese lo ocurrido y decida el siguiente paso','Para resumir la trama','Para describir el paisaje'],a:0,w:'Da humanidad y prepara la escena siguiente.'},{q:'Si al comparar la entrada y la salida de una escena nada cambió...',o:['La escena no está trabajando: conviene reescribirla o cortarla','La escena es perfecta','Debe alargarse'],a:0,w:'La escena existe para producir cambio.'}]);
const L13=L('l13',1,19,'Punto de vista y distancia narrativa','Quién cuenta, cuánto sabe y a qué distancia: la decisión que condiciona todo el relato.',['estilo y voz','estructura narrativa'],`<p>El punto de vista decide quién cuenta la historia, qué puede saber y qué debe ignorar. Es una de las primeras decisiones y una de las más difíciles de cambiar después.</p><h3>Las lentes principales</h3><ul><li><b>Primera persona:</b> íntima, pero limitada a lo que el narrador vive y sospecha.</li><li><b>Tercera limitada:</b> sigue a un personaje y accede solo a su mente; es la más usada.</li><li><b>Omnisciente:</b> sabe todo de todos y permite panorama, a costa de distancia.</li><li><b>Segunda persona:</b> poco frecuente, casi hipnótica.</li></ul><h3>La distancia narrativa</h3><p>Más allá de la persona gramatical existe la distancia: el narrador puede estar lejos («Un hombre cruzó la plaza») o dentro de la cabeza del personaje («Cruzó la plaza; ya no soportaba esas miradas»). Acercarse da emoción; alejarse, perspectiva. Conviene moverse con intención, no por azar.</p><h3>Qué sabe y qué calla</h3><p>El punto de vista es también un filtro de información. Un narrador que ignora algo crea suspenso; uno que miente crea ambigüedad; uno que lo sabe todo crea ironía. Pregunta siempre qué necesita saber el lector y cuándo.</p><h3>Errores comunes</h3><ul><li>Saltar de una mente a otra dentro de la misma escena sin aviso.</li><li>Dar datos que el personaje no puede conocer.</li><li>Cambiar de lente sin una razón narrativa clara.</li></ul><blockquote>Elegir el punto de vista es elegir qué historia se puede contar.</blockquote>`,{t:'Una escena, dos miradas',d:'d',s:'Cuenta lo mismo desde dos lentes.',c:'Narra una misma discusión en 150 palabras: primero en tercera limitada desde un personaje y luego desde el otro. Anota qué cambia en lo que se sabe y en el tono.',min:150},[{q:'¿Qué ocurre si el narrador salta a la mente de otro personaje en la misma escena sin aviso?',o:['Se confunde al lector y se rompe la inmersión','Se gana intimidad','Nada relevante'],a:0,w:'El punto de vista debe ser coherente dentro de la escena.'},{q:'Un narrador que ignora algo importante suele generar...',o:['Suspenso','Aburrimiento','Claridad total'],a:0,w:'Lo que el narrador no sabe es lo que el lector quiere descubrir.'},{q:'La «distancia narrativa» se refiere a...',o:['Qué tan cerca está el narrador de la mente del personaje','Cuántas páginas tiene el relato','La distancia entre dos escenas'],a:0,w:'Acercarse da emoción; alejarse, perspectiva.'}]);

const EX2={l4:`<h3>Un ejemplo breve</h3><p>«Una niña quiere recuperar a su perro perdido (deseo). El río crecido le cierra el camino (obstáculo). Cruza sola y descubre que el perro ya no la necesita (resultado).» En tres frases hay arco: querer, chocar, cambiar.</p>`,l5:`<h3>Un ejemplo breve</h3><p>«Marta dice que no le importa la herencia, pero guarda la llave de la casa en el bolsillo del abrigo y la toca cada vez que alguien menciona a su hermano.» Un deseo oculto y un gesto bastan para sugerir una persona entera.</p>`,l6:`<h3>Un ejemplo con subtexto</h3><p>—¿Cenas en casa? —preguntó él.<br>—Hay mucho trabajo —dijo ella, sin dejar de mirar la pantalla.</p><p>Ninguno habla de la distancia que crece entre los dos, pero la escena entera trata de eso. Observa también el formato: raya al empezar, verbo de habla pegado y sin punto antes de él.</p>`,l7:`<h3>Un ejemplo breve</h3><p>«Recogió los platos sin que nadie se lo pidiera y los lavó dos veces. Cuando por fin se secó las manos, miró el teléfono y lo puso boca abajo.» Nunca se nombra la angustia, pero el lector la reconoce.</p>`,l12:`<h3>Un ejemplo breve</h3><p><i>Escena:</i> Lucía intenta convencer a su madre de vender la casa; la madre se niega y cierra la puerta. <i>Secuela:</i> Lucía se queda en el pasillo, siente rabia y luego vergüenza, y decide llamar a su hermano. Hay objetivo, conflicto, desenlace y un paso siguiente.</p>`};

Object.assign(byId('l8'),{min:22,html:byId('l8').html.replace('<blockquote>',`<h3>Un ejemplo de detalle que construye mundo</h3><p>«En el mercado, nadie regateaba con los de la torre; pagaban primero y miraban al suelo.» Sin explicar nada, el lector intuye una jerarquía y un miedo.</p><blockquote>`),qs:[...byId('l8').qs,{q:'¿Qué logra un «detalle significativo»?',o:['Sugerir la jerarquía o la cultura del mundo sin explicarla','Describir todo el mapa','Reemplazar al personaje'],a:0,w:'Un detalle bien elegido insinúa un mundo entero.'}]});
Object.assign(byId('l9'),{min:20,html:byId('l9').html.replace('<blockquote>',`<h3>La tensión como pregunta abierta</h3><p>La tensión no nace de la acción, sino de la incertidumbre: el lector quiere saber qué pasará. Plantea una pregunta (¿lo descubrirán?, ¿llegará a tiempo?) y retrasa la respuesta con complicaciones.</p><h3>Ritmo dentro de la escena</h3><p>Dentro de una misma escena puedes acelerar y frenar: oraciones cortas en el pico del peligro y una pausa justo antes del golpe para estirar la espera. El contraste hace que el pico se sienta más fuerte.</p><h3>Cortes que obligan a seguir</h3><p>Terminar una escena en el punto de mayor incertidumbre empuja a seguir leyendo. Cortar antes de la resolución y volver a ella más tarde es una de las herramientas más simples del suspenso.</p><h3>Errores comunes</h3><ul><li>Sostener la máxima tensión todo el tiempo: el lector se agota.</li><li>Resolver el misterio demasiado pronto.</li><li>Frenar la acción con explicaciones largas en el peor momento.</li></ul><blockquote>`),qs:[...byId('l9').qs,{q:'¿Dónde conviene cortar una escena para sostener el suspenso?',o:['En el punto de mayor incertidumbre','Después de resolverlo todo','Antes de presentar al personaje'],a:0,w:'Lo que queda sin resolver empuja a seguir.'}]});
const L14=L('l14',2,18,'Ambientación sensorial y atmósfera','Cómo construir lugares vivos con los cinco sentidos y crear atmósfera con detalles elegidos.',['descripcion y ambientacion','worldbuilding'],`<p>Una buena ambientación no se limita a decir dónde ocurre la escena: hace sentir cómo es estar allí. La atmósfera es el clima emocional que ese lugar le transmite al lector.</p><h3>Los cinco sentidos</h3><ol><li><b>Vista:</b> la que más se usa y la que menos sorprende; busca el detalle poco evidente.</li><li><b>Oído:</b> ruidos de fondo, silencios, voces lejanas.</li><li><b>Olfato:</b> el sentido más ligado a la memoria.</li><li><b>Tacto:</b> temperatura, textura, peso.</li><li><b>Gusto:</b> poco usado y, por eso, potente.</li></ol><h3>Elegir, no acumular</h3><p>Dos o tres detalles precisos construyen una escena mejor que un inventario. Escoge los que el personaje notaría y los que sirven al ánimo de la escena: en un duelo, el reloj que sigue marcando la hora.</p><h3>Atmósfera por coherencia y por contraste</h3><p>La atmósfera se construye con detalles coherentes (luz, sonido, ritmo de las frases) que empujan en la misma dirección. También puede crearse por contraste: un día radiante en el peor momento vuelve más dura la escena.</p><h3>El lugar filtrado por el personaje</h3><p>Describe lo que el personaje ve, no lo que existe. Un ladrón y un arquitecto no miran la misma casa.</p><h3>Un ejemplo</h3><p>«La casa olía a humedad y a sopa recalentada. En algún lugar, una llave goteaba con la paciencia de quien espera algo.» Dos sentidos y una imagen bastan para instalar un clima.</p><blockquote>Describir es elegir qué ve quien mira.</blockquote>`,{t:'Un lugar con tres sentidos',d:'m',s:'Construye atmósfera con detalles sensoriales.',c:'Describe en 180 palabras un lugar usando al menos tres sentidos distintos a la vista, de modo que el lector sienta un ánimo concreto (calma, amenaza, nostalgia) sin nombrarlo.',min:150},[{q:'¿Qué sentido está más ligado a la memoria?',o:['El olfato','La vista','El gusto'],a:0,w:'Un olor puede traer un recuerdo entero.'},{q:'Para describir un lugar conviene...',o:['Elegir pocos detalles que el personaje notaría y que sirvan al ánimo','Enumerar todo lo que hay','Evitar cualquier detalle'],a:0,w:'Elegir pesa más que acumular.'},{q:'¿Cómo puede crearse atmósfera?',o:['Con detalles coherentes o con un contraste deliberado','Con una lista de adjetivos','Con una explicación del narrador'],a:0,w:'La atmósfera surge de la coherencia o del contraste.'}]);
const L15=L('l15',2,18,'El tiempo narrativo: saltos, flashbacks y duración','Cómo manejar el tiempo del relato: resumen, elipsis, flashback, anticipo y control de la duración.',['estructura narrativa','ritmo y pacing'],`<p>El tiempo del relato no coincide con el tiempo real. El escritor decide qué momentos dilata, cuáles resume y cuáles salta. Dominarlo es dominar el ritmo de toda la historia.</p><h3>Cuatro movimientos del tiempo</h3><ol><li><b>Resumen:</b> comprime semanas en una frase («Pasaron tres inviernos»).</li><li><b>Escena:</b> el tiempo narrado coincide casi con el real.</li><li><b>Pausa:</b> la acción se detiene para describir o reflexionar.</li><li><b>Elipsis:</b> se omite un tramo por completo y el lector lo infiere.</li></ol><h3>Flashback y anticipo</h3><p>El <b>flashback</b> (analepsis) trae el pasado cuando el presente lo necesita; el <b>anticipo</b> (prolepsis) adelanta el futuro para crear expectativa («Años después recordaría esa tarde como la última tranquila»). Ambos funcionan si cumplen una función clara y no interrumpen la tensión.</p><h3>Marcar los saltos</h3><p>Orienta al lector con claridad: un cambio de párrafo o de capítulo, un indicador temporal («Aquella noche…») y tiempos verbales coherentes. La confusión temporal expulsa al lector.</p><h3>Dilatar y comprimir</h3><p>Dilata lo que importa emocionalmente (el segundo antes de abrir una carta) y comprime lo funcional (el viaje en tren). El peso de cada momento lo define el espacio que ocupa en la página.</p><h3>Errores comunes</h3><ul><li>Usar flashbacks solo para dar información que cabría en un diálogo.</li><li>Hacer saltos temporales sin ninguna señal.</li><li>Dar el mismo espacio a todos los momentos.</li></ul><blockquote>El tiempo de la historia se mide en importancia, no en minutos.</blockquote>`,{t:'Comprimir y dilatar',d:'d',s:'Juega con la duración de los momentos.',c:'Escribe 200 palabras donde un viaje de tres días ocupe dos frases y un solo instante (abrir una puerta, leer un mensaje) ocupe un párrafo entero.',min:170},[{q:'¿Qué es una elipsis narrativa?',o:['Omitir un tramo de tiempo y dejar que el lector lo infiera','Repetir una escena','Describir un lugar'],a:0,w:'Lo omitido también cuenta la historia.'},{q:'¿Cuándo funciona mejor un flashback?',o:['Cuando el presente necesita ese pasado y no frena la tensión','Siempre que hay información que dar','Al comienzo de cada capítulo'],a:0,w:'Debe tener una función clara.'},{q:'¿Qué conviene dilatar en el relato?',o:['Los momentos de mayor peso emocional','Los trayectos y trámites','Las transiciones'],a:0,w:'El espacio en la página señala la importancia.'}]);

Object.assign(byId('l10'),{min:18,html:`<p>La voz es la manera personal de mirar y de decir. No se inventa: se descubre escribiendo mucho. Es lo que hace que un lector reconozca a un autor aunque tape la portada.</p><h3>De qué está hecha una voz</h3><ol><li><b>Mirada:</b> qué notas y qué ignoras; lo que te obsesiona.</li><li><b>Léxico:</b> las palabras que eliges y las que jamás usarías.</li><li><b>Sintaxis:</b> tu manera de construir frases: cortas y secas, o largas y sinuosas.</li><li><b>Tono:</b> irónico, tierno, sombrío, distante.</li></ol><h3>Cómo encontrarla</h3><ol><li>Lee con atención a quienes admiras y nota qué hacen, no solo qué dicen.</li><li>Escribe sin filtro y revisa después: la voz aparece en lo que sale sin esfuerzo.</li><li>Identifica tus obsesiones: temas, imágenes y ritmos que se repiten.</li></ol><h3>Voz del autor y voz del narrador</h3><p>El autor tiene un estilo; cada narrador o personaje puede tener su propia voz. Un buen escritor domina su registro y puede adaptarlo: el mismo hecho suena distinto contado por un niño que por un juez.</p><h3>Imitar sin copiar</h3><p>Imitar a quienes admiras enseña, pero la voz propia aparece cuando dejas de intentar sonar a alguien. Un ejercicio útil: reescribe un párrafo ajeno con tus palabras y observa qué cambia.</p><h3>Errores comunes</h3><ul><li>Forzar un estilo «literario» lleno de adornos.</li><li>Cambiar de tono sin motivo dentro del mismo texto.</li><li>Confundir originalidad con rareza.</li></ul><blockquote>El estilo es lo que queda cuando dejas de intentar tenerlo.</blockquote>`,qs:[...byId('l10').qs,{q:'¿Qué suele ocurrir cuando se fuerza un estilo «literario»?',o:['El texto suena artificial y recargado','El texto gana naturalidad','El texto se vuelve más claro'],a:0,w:'La voz propia surge de la naturalidad, no del adorno.'}]});
const L16=L('l16',3,17,'Figuras retóricas al servicio del texto','Metáfora, símil, hipérbole, personificación y más: cuándo funcionan y cuándo estorban.',['estilo y voz','descripcion y ambientacion'],`<p>Las figuras retóricas son maneras de decir que se apartan de lo literal para ganar fuerza, imagen o emoción. Bien usadas, vuelven nuevo lo conocido; mal usadas, recargan el texto.</p><h3>Las esenciales</h3><ul><li><b>Símil:</b> compara con «como»: «ligera como una pluma».</li><li><b>Metáfora:</b> identifica una cosa con otra: «el insomnio era una ciudad sin semáforos».</li><li><b>Personificación:</b> da rasgos humanos a lo que no lo es: «la casa se resistía a callar».</li><li><b>Hipérbole:</b> exagera para enfatizar: «te lo dije mil veces».</li><li><b>Antítesis:</b> contrapone ideas: «tan cerca y tan lejos».</li><li><b>Anáfora:</b> repite al inicio de frases para crear cadencia.</li></ul><h3>Cuándo funciona una imagen</h3><p>Una buena imagen es precisa, sorprende sin ser absurda y encaja en el mundo del texto. Una metáfora de cocina funciona mejor en boca de una cocinera que de un astronauta.</p><h3>El cliché es una metáfora muerta</h3><p>«Llorar a mares» o «corazón de piedra» fueron imágenes vivas y hoy son ruido. Si una imagen te vino sin esfuerzo, probablemente es un cliché: busca la versión que solo tú escribirías.</p><h3>Una por vez</h3><p>Mezclar metáforas confunde («navegábamos en un mar de dudas que nos quemaba por dentro»). Elige una imagen, desarróllala y sigue.</p><h3>Un ejemplo</h3><p>«El tren avanzaba despacio, como quien lleva una noticia que preferiría no dar.» El símil hace sentir el ritmo y anticipa el tono.</p><blockquote>Una imagen vale lo que ilumina, no lo que adorna.</blockquote>`,{t:'Imágenes nuevas',d:'m',s:'Reemplaza lugares comunes por imágenes propias.',c:'Elige tres clichés («llorar a mares», «corazón de piedra», «blanco como la nieve») y reescríbelos con una imagen propia y precisa. Luego usa una de ellas en un párrafo de 100 palabras.',min:100},[{q:'¿Cuál es un símil?',o:['Fuerte como un roble','El tiempo es oro','La casa lloraba'],a:0,w:'El símil compara con «como» o «cual».'},{q:'¿Qué es un cliché?',o:['Una imagen tan usada que perdió su fuerza','Una figura retórica poco frecuente','Un error ortográfico'],a:0,w:'Fue una imagen viva y hoy es ruido.'},{q:'¿Por qué conviene evitar mezclar metáforas?',o:['Porque las imágenes se contradicen y confunden','Porque están prohibidas','Porque alargan el texto'],a:0,w:'Una imagen bien desarrollada vale más que varias a medias.'}]);
const L17=L('l17',3,16,'Musicalidad y ritmo de la prosa','Cadencia, repeticiones y silencios: cómo suena la prosa y cómo afinarla de oído.',['estilo y voz','ritmo y pacing'],`<p>La prosa también suena. Aunque se lea en silencio, el oído interno percibe cadencias, repeticiones y pausas. Afinar ese oído es una de las mejoras más rápidas que puede hacer un escritor.</p><h3>La cadencia</h3><p>Es el ritmo que producen los acentos y la longitud de las frases. Una frase larga que sube y termina en una corta cae como un golpe: «Esperó toda la tarde, mientras la luz se ponía naranja y luego gris y luego nada. Nadie vino.»</p><h3>Repetición: hechizo o torpeza</h3><p>Repetir una palabra o una estructura puede crear énfasis o música (anáfora); repetirla sin querer suena a descuido. Pregúntate si cada repetición es una decisión.</p><h3>Silencio y espacio en blanco</h3><p>El punto y aparte, la elipsis y la línea en blanco también son música: marcan una pausa que el lector siente. Un párrafo de una sola línea entre dos largos funciona como un golpe de tambor.</p><h3>Cacofonías y rimas involuntarias</h3><p>Evita los tres «que» seguidos, las rimas internas accidentales («entonces, sin dudarlo, lo miró cansado») y los choques de sonidos duros. Se detectan con la lectura en voz alta.</p><h3>El oído como editor</h3><ol><li>Lee tu texto en voz alta, sin prisa.</li><li>Marca dónde tropiezas o te quedas sin aire.</li><li>Reescribe esos puntos: cambia el orden, corta o puntúa distinto.</li></ol><blockquote>Si suena mal en voz alta, está mal en la página.</blockquote>`,{t:'Cadencia a propósito',d:'m',s:'Controla el ritmo con la longitud de las frases.',c:'Escribe un párrafo de 120 palabras en el que las frases se vayan acortando hasta terminar en una de tres palabras, para que el cierre caiga como un golpe.',min:100},[{q:'¿Qué efecto puede tener una frase corta tras varias largas?',o:['Cae como un golpe y da énfasis','Confunde al lector','No tiene efecto'],a:0,w:'El contraste marca el momento importante.'},{q:'¿Cómo se detectan mejor las cacofonías?',o:['Leyendo en voz alta','Con un corrector automático','Contando palabras'],a:0,w:'El oído detecta lo que el ojo pasa por alto.'},{q:'¿Cuándo es útil repetir una palabra?',o:['Cuando es una decisión para crear énfasis o cadencia','Siempre','Nunca'],a:0,w:'La repetición intencional es música; la accidental, descuido.'}]);

const L18=L('l18',3,17,'Precisión léxica: la palabra exacta','Verbos fuertes, sustantivos concretos y adjetivos justos: cómo elegir la palabra que dice exactamente lo que quieres.',['estilo y voz','gramatica y ortografia'],`<p>La diferencia entre una palabra casi correcta y la exacta se nota aunque el lector no sepa explicarla. La precisión léxica es elegir, entre varias opciones, la que dice justo lo que quieres decir y nada más.</p><h3>Verbos fuertes</h3><p>El verbo lleva la acción. En vez de «caminó lentamente», un verbo preciso: «arrastró los pies», «deambuló», «se deslizó». Un buen verbo hace innecesario el adverbio.</p><h3>Sustantivos concretos</h3><p>«Un animal» no se ve; «un perro cojo» sí. Cambia las palabras genéricas (cosa, objeto, lugar, persona) por otras específicas que evoquen una imagen.</p><h3>Adjetivos justos</h3><p>Un adjetivo exacto vale más que tres vagos. Si el sustantivo ya incluye la cualidad («la nieve fría»), el adjetivo sobra. Pregúntate si añade información nueva.</p><h3>Palabras comodín</h3><p>Tres vigilantes: «cosa», «muy» y «algo». Aparecen cuando no sabemos qué decir. Búscales un sustituto concreto: «muy cansado» se vuelve «agotado» o «hecho polvo».</p><h3>Registro y contexto</h3><p>La palabra exacta depende de quién habla y dónde: un niño dice «pelota»; un narrador técnico, «esfera de cuero». Mantén el registro coherente con la voz del texto.</p><h3>Cómo practicarlo</h3><ol><li>Subraya los verbos «ser», «estar», «hacer» y «tener» y busca reemplazos más precisos.</li><li>Cambia cada «muy + adjetivo» por una sola palabra.</li><li>Consulta un diccionario de sinónimos, pero comprueba el matiz antes de aceptar.</li></ol><blockquote>La palabra justa no suena a esfuerzo: suena a inevitable.</blockquote>`,{t:'Cacería de comodines',d:'m',s:'Sustituye palabras vagas por precisas.',c:'Escribe un párrafo de 120 palabras sobre una persona esperando en una estación sin usar «cosa», «algo», «muy» ni el verbo «estar». Luego subraya tus tres verbos más fuertes.',min:100},[{q:'¿Qué ventaja tiene un verbo preciso?',o:['Hace innecesario el adverbio y da fuerza a la acción','Alarga la frase','Vuelve el texto más formal'],a:0,w:'El verbo lleva la acción.'},{q:'¿Cuál es más concreto?',o:['Un animal estaba en la calle','Un perro cojo cruzaba la calle','Había una cosa en la calle'],a:1,w:'Lo concreto se ve; lo genérico no.'},{q:'¿Cuándo sobra un adjetivo?',o:['Cuando repite una cualidad que el sustantivo ya incluye','Cuando es corto','Cuando va primero'],a:0,w:'Un adjetivo debe aportar información nueva.'}]);
const L19=L('l19',3,18,'Revisión y edición: el método de reescritura','Un método por capas para convertir un borrador en un texto sólido: estructura, escena, frase y corrección.',['gramatica y ortografia','estilo y voz'],`<p>Escribir es reescribir. El borrador existe para que haya algo que mejorar; la calidad se construye en la revisión. Revisar bien es hacerlo por capas, de lo grande a lo pequeño.</p><h3>Primero, distancia</h3><p>Deja reposar el texto unos días. Con distancia vuelves a ser lector y ves lo que antes no veías. Si no puedes esperar, cambia el formato (imprímelo, cambia la tipografía) para mirarlo con ojos nuevos.</p><h3>Las cuatro capas</h3><ol><li><b>Estructura:</b> ¿cada escena cambia algo? ¿hay partes que sobran o falta alguna?</li><li><b>Escena y personajes:</b> ¿hay objetivo y conflicto? ¿las voces son distintas y coherentes?</li><li><b>Frase y párrafo:</b> ritmo, claridad, repeticiones y palabras vagas.</li><li><b>Corrección:</b> ortografía, puntuación, tiempos verbales y detalles.</li></ol><h3>Recortar</h3><p>Casi todo borrador mejora al perder un diez por ciento. Elimina lo redundante, los adverbios innecesarios y los comienzos lentos: muchas escenas empiezan mejor una o dos frases más adelante.</p><h3>Leer en voz alta</h3><p>El oído detecta lo que el ojo perdona: tropiezos, repeticiones, frases kilométricas. Lee todo en voz alta al menos una vez.</p><h3>Recibir feedback</h3><p>Pide a un lector que marque dónde se aburrió, dónde se confundió y qué recuerda. No discutas sus comentarios: busca el patrón. Si dos lectores tropiezan en el mismo lugar, ahí hay un problema.</p><h3>Cuándo parar</h3><p>Una versión nunca es perfecta. Detente cuando los cambios solo sean de gusto y ya no mejoren la claridad, la emoción o la tensión.</p><blockquote>Primero lo grande, después lo pequeño.</blockquote>`,{t:'Revisión por capas',d:'d',s:'Revisa un texto tuyo en cuatro pasos.',c:'Toma un texto tuyo de 250 palabras o más y revísalo en cuatro pasadas: estructura, escena, frases y corrección. Escribe una lista breve de los cambios que hiciste en cada capa.',min:150},[{q:'¿Por qué conviene revisar por capas?',o:['Porque pulir frases de una escena que quizá sobre es trabajo perdido','Porque es más rápido','Porque así no hay que releer'],a:0,w:'Primero lo grande, después lo pequeño.'},{q:'¿Qué sugiere que hay un problema real en el texto?',o:['Que varios lectores tropiezan en el mismo punto','Que un lector no coincide con tu gusto','Que el texto es breve'],a:0,w:'Los patrones importan más que los comentarios sueltos.'},{q:'¿Cuándo conviene detener la revisión?',o:['Cuando los cambios son solo de gusto y no mejoran claridad, emoción ni tensión','Cuando te cansas','Nunca'],a:0,w:'Una versión nunca es perfecta; basta con que funcione.'}]);
const L20=L('l20',3,17,'Leer como escritor','Cómo analizar el oficio de otros autores para aprender técnicas y construir tu propio criterio.',['estilo y voz','estructura narrativa'],`<p>Todo escritor aprende leyendo, pero no de cualquier manera. Leer como escritor es preguntarse no solo qué dice un texto, sino cómo lo hace y por qué funciona.</p><h3>Dos lecturas</h3><p>Primero lee como lector: déjate llevar y anota qué sentiste. Después relee como escritor: detente en los pasajes que te conmovieron y desarma el mecanismo que los produjo.</p><h3>Qué mirar en un texto</h3><ol><li><b>Apertura:</b> ¿cómo atrapa en la primera página?</li><li><b>Estructura:</b> ¿dónde están el detonante, el giro y el cierre?</li><li><b>Voz y punto de vista:</b> ¿quién cuenta y a qué distancia?</li><li><b>Frases y ritmo:</b> ¿cómo alterna cortas y largas?</li><li><b>Detalles:</b> ¿qué imágenes concretas recuerdas?</li></ol><h3>Anotar y copiar a mano</h3><p>Copiar a mano un párrafo que admires obliga a notar decisiones que la lectura rápida esquiva: dónde pone la coma, qué verbo elige. Anota también lo que no te funcionó: aprender qué evitar es igual de valioso.</p><h3>Imitar para aprender</h3><p>Escribe un párrafo con la misma estructura de uno ajeno (primero una frase larga, luego dos cortas, cierre con imagen) pero con tu tema y tus palabras. No es copiar: es entrenar el oído.</p><h3>Leer ampliamente</h3><p>Lee géneros distintos al que escribes y también lo que te cuesta. Cada tradición te enseña un recurso nuevo, y mezclarlas es una de las fuentes de la voz propia.</p><h3>Un cuaderno de lecturas</h3><p>Anota por cada lectura una técnica que quieras probar y un fragmento que te haya impactado, con una línea sobre por qué.</p><blockquote>Se lee con los ojos de lector y se relee con las manos de escritor.</blockquote>`,{t:'Autopsia de un párrafo',d:'m',s:'Desarma un párrafo que admires.',c:'Elige un párrafo de un autor que admires y escribe 150 palabras explicando cómo funciona: qué verbo, qué imagen y qué ritmo producen el efecto. Después escribe un párrafo tuyo con la misma estructura y otro tema.',min:150},[{q:'¿En qué se diferencia leer como escritor de leer como lector?',o:['Se analiza cómo funciona el texto, no solo qué dice','Se lee más rápido','Se evita disfrutar del texto'],a:0,w:'Se desarma el mecanismo detrás del efecto.'},{q:'¿Para qué sirve copiar a mano un párrafo admirado?',o:['Para notar decisiones que la lectura rápida esquiva','Para apropiarse del texto','Para ahorrar tiempo'],a:0,w:'La mano obliga a ver cada elección.'},{q:'¿Por qué conviene leer géneros distintos al propio?',o:['Cada tradición enseña recursos nuevos','Para escribir en todos los géneros a la vez','Para no leer lo que te gusta'],a:0,w:'Mezclar tradiciones alimenta la voz propia.'}]);

const L21=L('l21',4,18,'Poesía: imagen, verso y silencio','Cómo funciona un poema: imagen, corte de verso, ritmo, verso libre y métrica.',['estilo y voz','descripcion y ambientacion'],`<p>La poesía dice lo máximo con lo mínimo. No explica una emoción: la encarna en una imagen, un ritmo y un silencio. Escribirla es aprender a elegir cada palabra como si fuera la única.</p><h3>La imagen es el núcleo</h3><p>Un poema piensa con imágenes, no con ideas abstractas. En lugar de «sentí soledad», un cuarto con dos tazas y una sola usada. El lector completa el sentimiento.</p><h3>El verso y el corte</h3><p>Cortar la línea es decidir una pausa. El final del verso da peso a la palabra que cierra; cortar en medio de una frase crea tensión y sorpresa. Prueba el mismo texto con cortes distintos.</p><h3>Verso libre y métrica</h3><p>El verso libre no tiene rima ni medida fija, pero sí ritmo. La métrica tradicional (el endecasílabo de once sílabas, el octosílabo de ocho) ofrece una música reconocible. Conocerla da libertad incluso para romperla.</p><h3>Sonido y repetición</h3><p>Aliteraciones, rimas internas y anáforas crean cadencia. Léelo en voz alta: un poema debe sonar bien antes de significar algo.</p><h3>Qué evitar</h3><ul><li>Abstracciones vagas (alma, eternidad, dolor) sin una imagen que las sostenga.</li><li>Rimar a la fuerza y sacrificar el sentido.</li><li>Explicar el poema en el último verso.</li></ul><blockquote>Un poema no se explica: se hace sentir.</blockquote>`,{t:'Un poema de una imagen',d:'m',s:'Construye un poema alrededor de una sola imagen.',c:'Escribe un poema de entre 8 y 12 versos sobre una emoción sin nombrarla, usando una sola imagen central. Haz dos versiones con cortes de verso distintos y quédate con la mejor.',min:60},[{q:'¿Qué suele funcionar mejor en un poema?',o:['Una imagen concreta que encarne la emoción','Una explicación de lo que se siente','Una lista de abstracciones'],a:0,w:'El poema piensa con imágenes.'},{q:'¿Qué es el verso libre?',o:['Verso sin rima ni medida fija, pero con ritmo propio','Verso sin ritmo alguno','Verso con rima obligatoria'],a:0,w:'Libre de medida, no de música.'},{q:'¿Qué efecto tiene cortar el verso en medio de una frase?',o:['Crea tensión y sorpresa','Hace el poema más claro','Cierra el sentido'],a:0,w:'El corte decide dónde se detiene el lector.'}]);
const L22=L('l22',4,16,'Microrrelato: contar mucho con poco','Brevedad, sugerencia y final abierto: cómo contar una historia completa en pocas líneas.',['estructura narrativa','estilo y voz'],`<p>El microrrelato cuenta una historia completa en pocas líneas, a veces en pocas palabras. Obliga a decidir qué sobra y a confiar en que el lector completará lo demás.</p><h3>Qué necesita para ser relato</h3><p>Aunque sea breve, debe haber un cambio: un personaje, una situación y una alteración. Una descripción bonita no es un microrrelato; tiene que pasar algo, aunque sea sugerido.</p><h3>Economía extrema</h3><ul><li>Entra en la historia lo más tarde posible.</li><li>Un solo personaje, un solo conflicto, una sola escena.</li><li>Cada palabra trabaja: si puedes quitarla, quítala.</li></ul><h3>El título como parte de la historia</h3><p>En un texto tan corto, el título es una herramienta: puede dar contexto, crear ironía o cambiar el sentido de lo que sigue. Úsalo como una frase más.</p><h3>El final que resuena</h3><p>El microrrelato suele cerrar con un giro, una imagen o una elipsis que obliga al lector a reconstruir lo no dicho. Lo que queda fuera pesa tanto como lo que está.</p><h3>Un ejemplo</h3><p>«Cada noche dejaba la luz del pasillo encendida. Ya nadie vivía allí, pero la costumbre era más fuerte que el duelo.» En dos frases hay personaje, hábito, pérdida y una historia entera detrás.</p><h3>Cómo trabajarlo</h3><p>Escribe primero sin límite y luego recorta hasta quedarte con lo esencial. Comparar la versión larga con la corta enseña qué importa en tu historia.</p><blockquote>Lo que no se cuenta también cuenta.</blockquote>`,{t:'Cincuenta palabras',d:'m',s:'Cuenta una historia completa en 50 palabras.',c:'Escribe un microrrelato de exactamente 50 palabras (sin contar el título) con personaje, cambio y un final que resuene. Después escríbelo en 100 palabras y compara qué perdiste y qué ganaste.',min:50},[{q:'¿Qué debe tener un microrrelato, aunque sea breve?',o:['Un cambio: personaje, situación y alteración','Solo una descripción bella','Un narrador omnisciente'],a:0,w:'Sin cambio no hay relato.'},{q:'¿Qué papel puede cumplir el título?',o:['Aportar contexto o cambiar el sentido del texto','Resumir el final','Ninguno'],a:0,w:'En un texto breve, el título trabaja como una frase más.'},{q:'¿Cómo se trabaja la economía extrema?',o:['Escribiendo sin límite y recortando hasta lo esencial','Añadiendo detalles','Evitando todo conflicto'],a:0,w:'Comparar versiones enseña qué importa.'}]);
const L23=L('l23',4,18,'Ensayo y no ficción: pensar por escrito','Tesis, argumentos y voz personal: cómo escribir textos de ideas y de hechos reales con claridad.',['estructura narrativa','estilo y voz'],`<p>El ensayo es pensar por escrito: una voz que sigue una idea, la pone a prueba y la comunica con claridad. La no ficción narrativa (crónica, memoria, reportaje) usa las herramientas del relato para contar hechos reales.</p><h3>La tesis: qué defiendes</h3><p>Un buen ensayo gira en torno a una idea que puedas resumir en una frase y que alguien pueda discutir. «Internet cambió la lectura» es un tema; «Leer en pantalla nos vuelve más impacientes, pero no peores lectores» es una tesis.</p><h3>Argumentar con pruebas</h3><ol><li>Plantea la idea.</li><li>Apóyala con ejemplos, datos o experiencias concretas.</li><li>Considera una objeción y respóndela.</li><li>Cierra con lo que cambia si tienes razón.</li></ol><h3>La voz personal</h3><p>El ensayo admite el «yo»: una experiencia propia puede abrir una idea general. Pero evita que la anécdota reemplace al argumento: sirve a la tesis, no al revés.</p><h3>Claridad ante todo</h3><p>Frases directas, párrafos con una idea central y términos definidos. La densidad no es profundidad: si el lector no te entiende, el pensamiento no llegó.</p><h3>No ficción narrativa</h3><p>Para contar hechos reales, usa escena, detalle y estructura: personajes concretos, tiempo ordenado y tensión. La regla ética es no inventar: lo que se presenta como real debe serlo.</p><h3>Errores comunes</h3><ul><li>Una tesis tan amplia que nadie podría refutarla.</li><li>Acumular citas sin voz propia.</li><li>Cerrar repitiendo la introducción.</li></ul><blockquote>Un ensayo es una idea que aprende a caminar.</blockquote>`,{t:'Tesis y primera prueba',d:'m',s:'Formula una tesis y defiéndela.',c:'Escribe una tesis discutible en una frase y desarrolla en 200 palabras: la idea, un ejemplo concreto, una objeción posible y tu respuesta.',min:180},[{q:'¿Cuál es una tesis?',o:['Leer en pantalla nos vuelve más impacientes, pero no peores lectores','Internet y la lectura','La lectura en pantalla'],a:0,w:'Una tesis afirma algo que se puede discutir.'},{q:'¿Qué regla ética rige la no ficción narrativa?',o:['No inventar lo que se presenta como real','Evitar los detalles','Usar siempre un narrador omnisciente'],a:0,w:'Lo que se dice como real debe serlo.'},{q:'¿Cómo debe usarse una anécdota en un ensayo?',o:['Como apoyo de la tesis, no como reemplazo del argumento','Como único argumento','Como conclusión siempre'],a:0,w:'La anécdota sirve a la idea.'}]);
const L24=L('l24',4,19,'Fantasía y ciencia ficción: lo imposible creíble','Reglas internas, un solo elemento imposible y consecuencias: cómo construir relatos de lo extraordinario.',['worldbuilding','estructura narrativa'],`<p>La fantasía y la ciencia ficción cuentan lo imposible con la seriedad de lo cotidiano. Su fuerza no está en lo extraordinario, sino en lo humano que ese elemento revela.</p><h3>Una pregunta de partida</h3><p>Casi toda buena historia especulativa nace de un «¿qué pasaría si…?»: ¿qué pasaría si la gente pudiera borrar recuerdos?, ¿si un reino dependiera de una sola fuente de agua? La pregunta se responde con personajes, no con teoría.</p><h3>Una novedad, muchas consecuencias</h3><p>Un solo elemento imposible bien explorado rinde más que diez a medias. Pregúntate cómo cambian por su causa la economía, las costumbres, las relaciones y el lenguaje.</p><h3>Reglas claras y costos</h3><p>La magia o la tecnología necesitan límites y precios. Si todo es posible, nada importa. Las reglas deben respetarse: el lector acepta lo imposible, pero no la trampa.</p><h3>Lo extraordinario como metáfora</h3><p>Los mejores relatos del género hablan de lo real a través de lo imaginario: el poder, la memoria, el miedo al otro. Mantén al personaje y su conflicto emocional en el centro.</p><h3>Introducir sin explicar</h3><p>Aplica la regla del iceberg: muestra el mundo a través de lo que los personajes dan por sentado. Evita las lecciones de historia en medio de la acción.</p><h3>Errores comunes</h3><ul><li>Nombres y términos inventados sin función.</li><li>Un sistema de magia que resuelve cada problema sin costo.</li><li>Personajes que existen solo para explicar el mundo.</li></ul><blockquote>Lo imposible convence cuando lo humano es verdadero.</blockquote>`,{t:'¿Qué pasaría si…?',d:'d',s:'Parte de una pregunta especulativa.',c:'Formula una pregunta «¿qué pasaría si…?» y escribe en 220 palabras una escena cotidiana donde se vean tres consecuencias de esa novedad en la vida de un personaje, sin explicar el mundo.',min:200},[{q:'¿Por qué una magia sin límites resta interés a la historia?',o:['Porque si todo es posible, nada importa','Porque es difícil de escribir','Porque aburre a los personajes'],a:0,w:'Los límites y costos generan tensión.'},{q:'¿Qué suele rendir más en un relato especulativo?',o:['Un solo elemento imposible bien explorado','Diez elementos sin desarrollar','Ninguno'],a:0,w:'La profundidad supera a la cantidad.'},{q:'¿Cómo conviene introducir el mundo?',o:['A través de lo que los personajes dan por sentado','Con un prólogo explicativo','Con un glosario inicial'],a:0,w:'Lo cotidiano para el personaje revela el mundo.'}]);
const L25=L('l25',4,18,'Misterio y suspenso: la pregunta y la pista','Pistas justas, información dosificada y giros que sorprenden sin hacer trampa.',['tension y conflicto','estructura narrativa'],`<p>El misterio plantea una pregunta (¿quién lo hizo?, ¿qué pasó?) y el suspenso, un peligro que se acerca (¿qué le va a ocurrir?). Ambos viven de lo que el lector sabe y de lo que aún no sabe.</p><h3>Misterio y suspenso no son lo mismo</h3><p>En el misterio, el lector descubre junto al detective un hecho pasado. En el suspenso, el lector sabe más que el personaje y teme lo que viene. El primero apela a la inteligencia; el segundo, a la angustia.</p><h3>Pistas justas</h3><p>El lector debe poder resolver el enigma, o al menos sentir que pudo. Siembra las pistas a la vista, mezcladas con detalles irrelevantes, y revélalas por su significado más tarde. Las soluciones que dependen de datos escondidos se perciben como trampa.</p><h3>Dosificar la información</h3><p>Cada capítulo debe responder una pregunta y abrir otra. Entrega la información en pequeñas dosis y vigila que cada revelación complique la situación en vez de cerrarla.</p><h3>Pistas falsas y giros</h3><p>Una pista falsa debe ser verosímil por sí misma. El giro final funciona cuando es sorprendente e inevitable: al releer, todo estaba allí.</p><h3>Reloj y apuestas</h3><p>Un plazo (el tren sale a medianoche) y un costo (si falla, alguien muere o se pierde algo valioso) aumentan la urgencia de cualquier escena.</p><h3>Errores comunes</h3><ul><li>Esconder datos clave al lector.</li><li>Un culpable que aparece por primera vez al final.</li><li>Resolver el enigma con una casualidad.</li></ul><blockquote>Un buen misterio no oculta la verdad: la deja a la vista.</blockquote>`,{t:'Siembra de pistas',d:'d',s:'Planta pistas justas en una escena.',c:'Escribe una escena de 220 palabras donde ocurra algo extraño y se vean tres pistas a la vista, una de ellas falsa. Después anota en una línea qué revelaría cada una.',min:200},[{q:'¿Cuál es la diferencia entre misterio y suspenso?',o:['En el suspenso el lector sabe más que el personaje y teme lo que viene','Son lo mismo','El misterio no tiene pistas'],a:0,w:'El misterio apela a la inteligencia; el suspenso, a la angustia.'},{q:'¿Qué caracteriza a una pista justa?',o:['Está a la vista del lector aunque aún no se entienda','Se esconde hasta el final','Aparece solo en el último capítulo'],a:0,w:'El lector debe poder resolverlo.'},{q:'¿Cuándo funciona un giro final?',o:['Cuando sorprende pero resulta inevitable al releer','Cuando contradice todo lo anterior','Cuando introduce un personaje nuevo'],a:0,w:'Sorpresa e inevitabilidad van juntas.'}]);

const L26=L('l26',5,17,'Trabajar con feedback: pedir, recibir y aplicar','Cómo conseguir lectores útiles, recibir comentarios sin defenderte y convertirlos en mejoras reales.',['estilo y voz','gramatica y ortografia'],`<p>Ningún escritor ve del todo su propio texto. El feedback es un espejo: bien usado, acelera años de aprendizaje; mal usado, paraliza o confunde. Saber pedirlo, recibirlo y aplicarlo es parte del oficio.</p><h3>A quién pedírselo</h3><p>Busca lectores que conozcan el tipo de texto que escribes y que se atrevan a ser honestos. Un familiar que solo elogia no sirve; un lector que quiere reescribirte a su gusto tampoco. Dos o tres lectores distintos dan un panorama más fiable que uno solo.</p><h3>Qué preguntar</h3><ol><li>¿Dónde te aburriste o dejaste de leer?</li><li>¿Dónde te confundiste?</li><li>¿Qué recuerdas, qué sentiste, a qué personaje creíste?</li><li>¿Qué cambiarías si fuera tuyo?</li></ol><h3>Recibirlo sin defenderte</h3><p>Escucha o lee sin explicar ni justificar. Si debes aclararle algo al lector, el texto no lo estaba diciendo. Anota todo: la reacción emocional se enfría y luego se vuelve útil.</p><h3>Buscar patrones, no recetas</h3><p>Los lectores suelen acertar en el problema y equivocarse en la solución. Si dos coinciden en que algo falla, ahí hay un problema real; la solución es tuya.</p><h3>Aplicarlo con orden</h3><p>Prioriza por capas: primero lo estructural, luego escenas, frases y corrección. No intentes arreglarlo todo en una pasada. Y decide qué comentarios no vas a seguir: es legítimo si lo decides conscientemente.</p><h3>Dar feedback también enseña</h3><p>Leer a otros con ojo crítico entrena el propio. Practica describir primero qué funciona y luego qué falla.</p><blockquote>El mejor lector es el que te dice dónde tropezó, no cómo debías caminar.</blockquote>`,{t:'Ronda de lectura',d:'m',s:'Pide y organiza feedback sobre un texto.',c:'Elige un texto tuyo y escribe 150 palabras con: a quién se lo pedirías, las cuatro preguntas que harías y cómo organizarías las respuestas para encontrar patrones.',min:120},[{q:'¿Cómo se reconoce un problema real a partir del feedback?',o:['Cuando varios lectores tropiezan en el mismo lugar','Cuando un lector lo dice con firmeza','Cuando coincide con tu opinión'],a:0,w:'Los patrones valen más que las opiniones sueltas.'},{q:'¿Qué conviene hacer al recibir un comentario?',o:['Escucharlo sin justificarte y anotarlo','Explicar lo que quisiste decir','Descartarlo de inmediato'],a:0,w:'Si necesitas explicar, el texto no lo decía.'},{q:'¿Por dónde conviene empezar a aplicar el feedback?',o:['Por lo estructural, y luego bajar a frases y corrección','Por las comas','Por los títulos'],a:0,w:'Primero lo grande, después lo pequeño.'}]);
const L27=L('l27',5,19,'Novela larga: planificar y sostener un proyecto extenso','Premisa, estructura de apoyo, el segundo acto y la rutina que permite terminar un libro.',['estructura narrativa','tension y conflicto'],`<p>Una novela es un maratón: no se gana con inspiración, sino con estructura y constancia. Planificar lo suficiente para no perderse y dejar libertad para descubrir es el equilibrio que busca cada escritor.</p><h3>Planificar o descubrir</h3><p>Algunos escritores planifican cada capítulo; otros descubren la historia mientras escriben. Casi todos acaban en un punto medio: conocen el final aproximado, los grandes giros y el conflicto central, y dejan margen para sorprenderse.</p><h3>La estructura de apoyo</h3><ol><li><b>Premisa:</b> una frase con protagonista, deseo, obstáculo y apuesta.</li><li><b>Tres actos y puntos de giro:</b> detonante, punto medio, crisis y clímax.</li><li><b>Mapa de escenas:</b> una lista breve de qué ocurre y qué cambia en cada una.</li></ol><h3>Sostener el ritmo en miles de palabras</h3><p>La novela larga necesita subtramas que se crucen con la principal, escenas de respiro entre las de tensión y promesas renovadas: cada capítulo debe dar al lector una razón para el siguiente.</p><h3>El «medio blando»</h3><p>El segundo acto es donde más se abandonan las novelas. Un punto medio fuerte (una revelación, una derrota, un cambio de objetivo) reactiva la historia y empuja hacia la crisis.</p><h3>Rutina y metas</h3><p>Define una meta diaria o semanal pequeña y registra el avance. Escribe el borrador completo antes de revisar: sin final, no hay forma de saber qué sobra.</p><h3>Organizar el material</h3><p>Lleva una «biblia» del proyecto con personajes, cronología, reglas del mundo y decisiones de estilo. Evita contradicciones y ahorra horas de búsqueda.</p><blockquote>Una novela se escribe una escena a la vez.</blockquote>`,{t:'Premisa y mapa',d:'d',s:'Planifica el esqueleto de una novela.',c:'Escribe una premisa de una frase y un mapa de 10 escenas (una línea cada una: qué ocurre y qué cambia) para una novela que te gustaría escribir.',min:150},[{q:'¿Qué suele reactivar el segundo acto?',o:['Un punto medio fuerte que cambia el objetivo o la situación','Más descripciones','Un nuevo narrador'],a:0,w:'El punto medio da nueva energía a la historia.'},{q:'¿Qué debe contener una buena premisa?',o:['Protagonista, deseo, obstáculo y apuesta','Solo el género','El final completo con todos los detalles'],a:0,w:'La premisa condensa el conflicto central.'},{q:'¿Qué conviene hacer con el primer borrador de una novela?',o:['Terminarlo completo antes de revisar','Corregir cada capítulo antes de seguir','Pedir feedback de cada escena'],a:0,w:'Sin final no se sabe qué sobra.'}]);
const L28=L('l28',5,16,'Publicar, concursos y vida de escritor','Caminos para dar a conocer tu texto, cómo prepararlo y cómo vivir con el rechazo.',['estilo y voz','gramatica y ortografia'],`<p>Escribir para uno mismo es un fin legítimo. Si quieres que tu texto llegue a otros, conviene conocer los caminos y prepararse para un recorrido de rechazos y aprendizajes.</p><h3>Caminos posibles</h3><ul><li><b>Revistas y antologías:</b> buen comienzo para cuento, poesía y ensayo breve.</li><li><b>Concursos:</b> ofrecen plazos, bases claras y a veces retroalimentación.</li><li><b>Editoriales y agentes:</b> para novelas y libros; exigen un manuscrito pulido y una carta de presentación.</li><li><b>Autopublicación y blogs:</b> control total, pero tú haces el trabajo de edición, diseño y difusión.</li></ul><h3>Preparar el material</h3><p>Lee las bases con cuidado: extensión, formato, tema y plazos. Un buen texto fuera de bases suele descartarse sin leerse. Corrige a fondo, pide una lectura externa y sigue las instrucciones al pie de la letra.</p><h3>La carta de presentación</h3><p>Breve y profesional: quién eres, qué envías y por qué encaja. Sin exagerar ni disculparte.</p><h3>Vivir con el rechazo</h3><p>El rechazo es la norma, no un veredicto. Cuenta tus envíos, no tus respuestas negativas, y sigue enviando. Cada texto mejora con la distancia y con cada revisión.</p><h3>Comunidad y oficio</h3><p>Los talleres, clubes de lectura y grupos de escritura dan feedback, plazos y ánimo. Participar en una comunidad acelera el aprendizaje y reduce la soledad del oficio.</p><h3>Precauciones</h3><ul><li>Desconfía de quien cobra por «publicar» tu libro sin condiciones claras.</li><li>Lee los contratos antes de ceder derechos.</li><li>Conserva siempre copia de tu manuscrito.</li></ul><blockquote>Publicar es un oficio aparte; escribir sigue siendo lo primero.</blockquote>`,{t:'Plan de envíos',d:'m',s:'Diseña un plan realista para dar a conocer tu texto.',c:'Elige un texto terminado y escribe 150 palabras con tres lugares donde lo enviarías, qué requisitos piden y qué cambiarías para adaptarlo a cada uno.',min:120},[{q:'¿Por qué importa leer las bases de un concurso?',o:['Porque un texto fuera de bases suele descartarse sin leerse','Porque son opcionales','Porque no afectan la evaluación'],a:0,w:'Cumplir las bases es el primer filtro.'},{q:'¿Cómo conviene interpretar un rechazo?',o:['Como parte habitual del proceso, no como un veredicto','Como prueba de que no sirves','Como motivo para dejar de escribir'],a:0,w:'Cuenta tus envíos, no tus rechazos.'},{q:'¿Qué precaución conviene tomar con quien ofrece publicar tu libro?',o:['Desconfiar si cobra sin condiciones claras y leer el contrato','Aceptar siempre','Ceder los derechos sin leer'],a:0,w:'Lee siempre antes de firmar o pagar.'}]);
const L29=L('l29',5,15,'Hábitos a largo plazo: la vida de un escritor','Rutinas sostenibles, lectura, cuidado de la energía y cómo medir tu avance con el paso de los años.',['estilo y voz','estructura narrativa'],`<p>El oficio se sostiene con años, no con arrebatos. Mantener la escritura viva a largo plazo es una cuestión de hábitos, de cuidado y de perspectiva.</p><h3>Rutinas que resisten</h3><p>Un horario fijo, un lugar y un ritual pequeño (café, música, una libreta) convierten escribir en una costumbre y no en una decisión diaria. La clave es que sea sostenible, no impresionante.</p><h3>Leer cada día</h3><p>Dedica tiempo a la lectura como parte del trabajo: lo que lees alimenta lo que escribes. Alterna entre lo que te encanta y lo que te desafía.</p><h3>Mantener un cuaderno</h3><p>Anota observaciones, frases, ideas, preguntas. Es la materia prima de futuros textos y un registro de tu evolución.</p><h3>Medir el progreso con amabilidad</h3><p>Compara tu escritura con la de hace seis meses, no con la de otros. Relee tus primeros textos y mira qué ya dominas: esa distancia es tu avance.</p><h3>Cuidar la energía</h3><p>Descansar, caminar, dormir y vivir también son parte del trabajo. Un escritor agotado escribe peor. Planifica pausas y no culpes a los periodos secos: a menudo preceden una etapa de claridad.</p><h3>Proyectos y ciclos</h3><p>Alterna proyectos largos con piezas cortas que den la satisfacción de terminar algo. Terminar enseña más que empezar diez cosas.</p><h3>Qué sigue después del curso</h3><p>Escribe, lee, revisa, comparte. Vuelve a estas lecciones cuando algo no funcione: cada una dirá algo distinto según tu experiencia.</p><blockquote>No hace falta escribir mucho: hace falta no dejar de escribir.</blockquote>`,{t:'Mi plan a un año',d:'f',s:'Diseña tu rutina de escritura a largo plazo.',c:'Escribe 150 palabras con tu plan para el próximo año: rutina, lecturas, metas de escritura, qué proyecto terminarás y cómo medirás tu avance.',min:120},[{q:'¿Cómo conviene medir el propio progreso?',o:['Comparándote con tu versión de hace meses','Comparándote con autores consagrados','No midiéndolo nunca'],a:0,w:'El avance se ve en la distancia con tu propio pasado.'},{q:'¿Qué rutina resiste mejor el paso del tiempo?',o:['La sostenible, aunque sea pequeña','La más exigente posible','La que depende de la inspiración'],a:0,w:'La constancia pesa más que la intensidad.'},{q:'¿Por qué conviene alternar proyectos largos con piezas cortas?',o:['Porque terminar algo da satisfacción y enseña','Porque los proyectos largos no valen la pena','Para evitar revisar'],a:0,w:'Terminar enseña más que empezar.'}]);

function puntuarGuia(Q,A){

 const sk={};Object.keys(ag).forEach(k=>{const a=ag[k];sk[k]=cp(20+a.reduce((x,y)=>x+y,0)/(2*a.length)*70,20,90);});

 return {sk,flojas,rec};}

MI('m16',10,'Tildes y acentuación: lo esencial','Reglas básicas de acentuación para escribir sin dudas.',['gramatica y ortografia'],`<p>La tilde no es un adorno: cambia el sonido y a veces el sentido («cantó» y «canto»). Con unas pocas reglas se resuelve la mayoría de los casos.</p><h3>Qué palabras llevan tilde</h3><ol><li><b>Agudas</b> (golpe en la última sílaba) si terminan en n, s o vocal: «canción», «café».</li><li><b>Llanas</b> (penúltima sílaba) si no terminan en n, s ni vocal: «árbol», «lápiz».</li><li><b>Esdrújulas:</b> siempre llevan tilde: «música», «teléfono».</li></ol><h3>Tilde diacrítica</h3><p>Distingue palabras iguales: «tú» (pronombre) y «tu» (posesivo); «él» y «el»; «sí» y «si»; «más» y «mas». Los interrogativos y exclamativos también la llevan: «¿qué?», «¿cómo?», «cuánto».</p><h3>Un hábito útil</h3><p>Ante la duda, di la palabra en voz alta marcando cada sílaba y decide dónde cae el golpe de voz.</p><blockquote>Una tilde de menos puede cambiar quién hizo qué.</blockquote>`,{t:'Detective de tildes',d:'f',s:'Practica las reglas con un texto corto.',c:'Escribe un párrafo de 80 palabras con al menos tres agudas, tres llanas, tres esdrújulas y los pares «tú/tu» y «él/el». Subraya cada tilde y explica en una línea por qué va.'}),
MI('m17',10,'La coma: usos clave y errores comunes','Cómo ordenar el pensamiento y dar aire a la frase.',['gramatica y ortografia','ritmo y pacing'],`<p>La coma ordena el pensamiento y da aire. Mal usada, confunde: «Vamos a comer, niños» no dice lo mismo que «Vamos a comer niños».</p><h3>Usos que debes dominar</h3><ol><li><b>Enumeración:</b> «Compró pan, leche y queso» (sin coma antes de «y»).</li><li><b>Vocativo:</b> «Ven aquí, Lucía».</li><li><b>Aclaración:</b> «Marta, mi vecina, llegó».</li><li><b>Conectores:</b> «Sin embargo, no vino».</li><li><b>Subordinada antepuesta:</b> «Cuando llegó, ya era tarde».</li></ol><h3>Errores frecuentes</h3><ul><li>Separar sujeto y verbo: «Los niños, juegan».</li><li>Poner coma antes de «que» sin motivo.</li><li>Omitir las comas de una aclaración.</li></ul><h3>Coma y ritmo</h3><p>Más comas aceleran y apilan; menos, estiran la frase. Úsalas como pausas de respiración que ayuden al sentido.</p><blockquote>Una coma bien puesta es una pausa que piensa.</blockquote>`,{t:'Dos lecturas',d:'m',s:'Cambia el sentido con una coma.',c:'Escribe tres frases que cambien de significado según la posición de una coma, y un párrafo de 80 palabras donde uses los cinco usos de la lista.'}),
MI('m18',11,'Concordancia y tiempos verbales','Evitar los tropiezos que el lector siente aunque no sepa explicar.',['gramatica y ortografia','estilo y voz'],`<p>Un texto se siente torpe cuando fallan la concordancia o los tiempos: el lector tropieza sin saber por qué.</p><h3>Concordancia</h3><p>Sustantivo, adjetivo y verbo deben coincidir en género y número: «Las casas viejas estaban vacías». Con sujetos largos, el verbo concuerda con el núcleo: «La caja de los libros viejos estaba rota».</p><h3>Elegir un tiempo base</h3><p>Decide si cuentas en pasado o en presente y mantenlo. En pasado, el pretérito suele marcar las acciones («abrió la puerta») y el imperfecto el fondo y el hábito («llovía, la casa olía a humedad»).</p><h3>Saltos justificados</h3><p>Cambia de tiempo solo con motivo: un flashback (pluscuamperfecto: «había llegado») o una verdad general (presente). Un salto sin razón se nota como error.</p><h3>Revisión rápida</h3><ol><li>Subraya los verbos de un párrafo.</li><li>Comprueba que el tiempo sea coherente.</li><li>Revisa quién hace cada acción.</li></ol><blockquote>El tiempo verbal es el suelo sobre el que camina el lector.</blockquote>`,{t:'Pretérito e imperfecto',d:'m',s:'Combina acción y fondo.',c:'Escribe 120 palabras en pasado donde las acciones estén en pretérito y el ambiente en imperfecto. Luego subraya cada verbo y verifica la coherencia.'}),
MI('m19',11,'Monólogo interior y flujo de conciencia','Mostrar lo que piensa un personaje sin filtro narrativo.',['descripcion de emociones','estilo y voz'],`<p>El monólogo interior muestra lo que piensa el personaje sin filtro narrativo: el lector habita su mente.</p><h3>Formas</h3><ol><li><b>Estilo directo:</b> «Pensó: debo irme ya».</li><li><b>Directo libre:</b> «Debo irme ya. No puedo seguir aquí».</li><li><b>Indirecto libre:</b> «Debía irse ya. No podía seguir allí».</li><li><b>Flujo de conciencia:</b> pensamiento continuo y asociativo, con poca puntuación.</li></ol><h3>Cómo hacerlo creíble</h3><p>La mente salta, repite y se interrumpe. Mezcla percepciones del entorno con recuerdos y deseos, y deja que un detalle externo dispare un pensamiento.</p><h3>Cuándo usarlo</h3><p>En momentos de decisión o crisis, para dar intimidad. Úsalo con medida: un monólogo largo frena la acción.</p><h3>Cuidado</h3><ul><li>Que el personaje piense con voz de narrador.</li><li>Explicar lo que sus gestos ya mostraron.</li></ul><blockquote>La mente no piensa en párrafos: piensa en saltos.</blockquote>`,{t:'Cinco minutos de mente',d:'d',s:'Escribe el pensamiento de un personaje en crisis.',c:'Escribe 150 palabras del pensamiento de un personaje que espera una respuesta importante. Mezcla lo que percibe, lo que recuerda y lo que teme, con saltos y repeticiones.'}),
MI('m20',11,'Motivación y trasfondo del personaje','Conocer por qué actúa para escribir decisiones coherentes.',['personajes'],`<p>Los personajes creíbles hacen cosas por razones. Conocer su motivación y su pasado te permite escribir decisiones coherentes.</p><h3>Tres capas</h3><ol><li><b>Motivación inmediata:</b> qué quiere en esta escena.</li><li><b>Deseo a largo plazo:</b> la meta que organiza su vida.</li><li><b>Herida de fondo:</b> el hecho del pasado que explica sus miedos.</li></ol><h3>Trasfondo útil</h3><p>No hace falta contarlo todo: elige dos o tres hechos del pasado que expliquen sus reacciones y deja el resto en la sombra.</p><h3>Una pregunta guía</h3><p>Ante cada decisión, pregúntate: ¿por qué hace esto ahora y no antes? La respuesta suele revelar la motivación real.</p><h3>Error común</h3><p>Dar un trasfondo trágico genérico para «justificarlo». La motivación debe conectar con el conflicto de la historia.</p><blockquote>Un personaje es la suma de lo que quiere y de lo que le duele.</blockquote>`,{t:'Tres capas',d:'m',s:'Define las motivaciones de un personaje.',c:'Describe en 150 palabras a un personaje con su motivación inmediata, su deseo a largo plazo y su herida de fondo, y muestra cómo una de ellas determina una decisión.'}),
MI('m21',11,'Dilemas morales y decisiones difíciles','Elegir entre dos opciones con costos reales: una fuente de tensión.',['tension y conflicto','personajes'],`<p>Un dilema obliga al personaje a elegir entre dos opciones con costos reales. Es una de las fuentes más fuertes de tensión.</p><h3>Qué lo hace dilema</h3><ol><li>Ambas opciones tienen algo valioso.</li><li>Ambas cuestan algo importante.</li><li>No hay salida intermedia sin precio.</li></ol><h3>Tipos</h3><ul><li><b>Bien contra bien:</b> lealtad contra honestidad.</li><li><b>Mal contra mal:</b> elegir el menor daño.</li><li><b>Deseo contra principio:</b> lo que quiere contra lo que cree.</li></ul><h3>Cómo escribirlo</h3><p>Muestra qué pierde con cada opción antes de que elija, deja que dude con acciones y haz que la decisión revele quién es. Después, que pague las consecuencias.</p><h3>Evita</h3><p>Dilemas falsos donde una opción es claramente mejor, o resolverlos con un golpe de suerte.</p><blockquote>Elegir cuesta; por eso la elección cuenta.</blockquote>`,{t:'Elegir cuesta',d:'d',s:'Escribe una escena de decisión difícil.',c:'Escribe una escena de 200 palabras donde un personaje deba elegir entre dos opciones valiosas. Muestra lo que pierde con cada una y deja que la decisión lo defina.'}),
MI('m22',10,'Obstáculos escalonados: cómo subir la tensión','Gradúa las dificultades para sostener el desarrollo.',['tension y conflicto','estructura narrativa'],`<p>La tensión crece cuando los obstáculos se vuelven más difíciles, no solo más numerosos. Esa gradación sostiene el desarrollo de una historia.</p><h3>Escalera de obstáculos</h3><ol><li><b>Menor:</b> una dificultad que el personaje resuelve con facilidad.</li><li><b>Mayor:</b> exige esfuerzo y deja un costo.</li><li><b>Crítico:</b> amenaza lo que más le importa.</li></ol><h3>Tres reglas</h3><ul><li>Cada obstáculo debe surgir de decisiones anteriores.</li><li>Cada solución debe traer un problema nuevo.</li><li>El último obstáculo debe exigir lo que el personaje aprendió.</li></ul><h3>Variar el tipo</h3><p>Alterna obstáculos externos (personas, lugares), internos (miedos, dudas) y de tiempo (plazos). Así evitas la monotonía.</p><h3>Descanso</h3><p>Tras un obstáculo fuerte, una escena de respiro vuelve más intenso el siguiente.</p><blockquote>Cada escalón debe ser más alto que el anterior.</blockquote>`,{t:'La escalera',d:'m',s:'Diseña tres obstáculos crecientes.',c:'Diseña una historia breve con tres obstáculos crecientes (uno menor, uno mayor y uno crítico) y describe en 150 palabras cómo cada uno surge del anterior.'}),
MI('m23',10,'Describir personas sin clichés','Retratos que seleccionan rasgos que cuentan quién es el personaje.',['descripcion y ambientacion','personajes'],`<p>Las descripciones de personajes caen fácil en el catálogo: pelo, ojos, altura. Un retrato vivo selecciona rasgos que cuenten quién es.</p><h3>Rasgos que dicen algo</h3><ul><li>Un gesto repetido.</li><li>La ropa que revela clase, oficio o estado de ánimo.</li><li>Cómo ocupa el espacio: encorvado, erguido, siempre cerca de la puerta.</li></ul><h3>Muéstralo en movimiento</h3><p>Describir mientras actúa es más vivo que detener la escena: «Revolvía el café sin mirar a nadie» dice más que «era un hombre tímido».</p><h3>Un detalle inesperado</h3><p>Un rasgo que contradiga la primera impresión vuelve memorable al personaje: un militar con manos de pianista.</p><h3>Evita</h3><ul><li>El espejo para que se describa a sí mismo.</li><li>Listas de rasgos físicos seguidas.</li><li>Comparaciones tópicas («ojos como el cielo»).</li></ul><blockquote>Un retrato es una selección, no un inventario.</blockquote>`,{t:'Retrato en acción',d:'m',s:'Retrata sin enumerar.',c:'Describe en 120 palabras a una persona que acaba de entrar a una sala, solo con gestos, ropa y detalles inesperados. Sin listar rasgos físicos ni usar el espejo.'}),
MI('m24',10,'Cultura, costumbres y creencias de un mundo','Hábitos, tabúes y ritos que hacen real a un lugar.',['worldbuilding'],`<p>Un mundo se siente real cuando la gente que lo habita tiene hábitos, tabúes y creencias que no necesitan explicación.</p><h3>Qué definir</h3><ol><li><b>Costumbres cotidianas:</b> cómo se saluda, se come, se duerme.</li><li><b>Creencias y tabúes:</b> lo sagrado y lo prohibido.</li><li><b>Fiestas y ritos:</b> cómo marcan el tiempo.</li><li><b>Lengua:</b> modismos, insultos, refranes.</li></ol><h3>Muéstralo, no lo expliques</h3><p>Una costumbre se transmite mejor cuando alguien la rompe: un forastero que ofende sin saberlo revela la norma sin explicarla.</p><h3>Coherencia</h3><p>Las costumbres deben nacer de la historia, el clima o la economía del lugar. Si el agua escasea, también lo hará el lenguaje del desperdicio.</p><blockquote>Una cultura se conoce por lo que castiga y por lo que celebra.</blockquote>`,{t:'El forastero',d:'m',s:'Revela una costumbre al romperla.',c:'Escribe 150 palabras de un forastero que rompe sin saberlo una costumbre local. Que la norma se deduzca por la reacción de los demás, sin explicarla.'}),
MI('m25',11,'Magia y tecnología con reglas y costos','Sistemas con límites que generan conflicto.',['worldbuilding','tension y conflicto'],`<p>Un sistema de magia o tecnología interesa cuando tiene límites. Los límites generan conflicto y obligan a ser ingenioso.</p><h3>Tres preguntas</h3><ol><li><b>¿Qué puede hacer?</b> Alcance y limitaciones.</li><li><b>¿Qué cuesta?</b> Energía, tiempo, recuerdos, riesgo.</li><li><b>¿Quién puede usarlo?</b> Acceso, formación, castigo.</li></ol><h3>Magia dura y blanda</h3><p>Una magia <b>dura</b> tiene reglas claras y permite resolver problemas con ellas; una <b>blanda</b> es misteriosa y sirve para generar asombro. No uses una magia blanda para resolver el clímax.</p><h3>Consecuencias sociales</h3><p>Pregunta cómo cambia el mundo por ese poder: economía, guerra, religión, desigualdad. Un solo elemento bien explorado enriquece todo.</p><blockquote>Lo que no cuesta nada no vale nada.</blockquote>`,{t:'Reglas y precio',d:'d',s:'Diseña un sistema con límites.',c:'Diseña en 180 palabras un poder o una tecnología con tres reglas, un costo y una consecuencia social, y muestra una escena donde el costo cause un problema.'}),
MI('m26',10,'Humor e ironía: el tono como herramienta','Cómo usar el humor sin romper la emoción.',['estilo y voz'],`<p>El humor es una forma de mirar: exagerar, contrastar o sorprender. Bien usado, humaniza y alivia; mal usado, rompe la emoción.</p><h3>Herramientas</h3><ol><li><b>Contraste:</b> tono solemne para algo trivial.</li><li><b>Exageración:</b> hipérbole con cara seria.</li><li><b>Ironía:</b> decir lo contrario de lo que se quiere decir.</li><li><b>Situación:</b> el personaje serio en un lugar absurdo.</li></ol><h3>Ritmo cómico</h3><p>El golpe de humor va al final de la frase. Corta lo que sobre: la brevedad hace reír.</p><h3>Humor y emoción</h3><p>Un chiste en el momento justo vuelve más humano el dolor. Pero no te rías del personaje: ríete con él.</p><h3>Ojo con</h3><ul><li>Explicar el chiste.</li><li>El humor que depende de estereotipos.</li></ul><blockquote>El humor es la seriedad que encontró una salida.</blockquote>`,{t:'Dos tonos',d:'m',s:'Cambia el tono de una escena.',c:'Escribe 120 palabras de una escena cotidiana (una cola en el banco) con tono solemne y luego con tono humorístico, cambiando solo el modo de contar.'}),
MI('m27',10,'Cómo recortar: economía y claridad','Que cada palabra trabaje, sin mutilar el texto.',['estilo y voz','gramatica y ortografia'],`<p>Escribir con economía no es escribir poco: es lograr que cada palabra trabaje. Recortar vuelve más claro y más fuerte un texto.</p><h3>Qué recortar primero</h3><ol><li>Adverbios que repiten al verbo («corrió rápidamente»).</li><li>Muletillas y conectores vacíos («en realidad», «de alguna manera»).</li><li>Frases que explican lo que la escena ya mostró.</li></ol><h3>Frases más cortas</h3><p>Convierte «Debido al hecho de que llovía, decidió quedarse» en «Llovía, así que se quedó». Busca el verbo y el sujeto y elimina el resto.</p><h3>La prueba de la tachadura</h3><p>Tacha una palabra: si el sentido no cambia, no hacía falta. Hazlo con adjetivos, adverbios y la primera frase del párrafo.</p><h3>Sin pasarte</h3><p>Recortar no es mutilar: conserva lo que da voz, ritmo y detalle concreto.</p><blockquote>Lo que sobra estorba; lo que falta se nota.</blockquote>`,{t:'Del 100 al 80',d:'m',s:'Recorta sin perder fuerza.',c:'Toma un párrafo tuyo de 100 palabras y redúcelo a 80 sin perder nada importante. Anota qué eliminaste y por qué.'}));
