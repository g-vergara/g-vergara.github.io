function refTxt(r){if(!r)return '';const c=r.cat||'';if(LECC.some(l=>l.t===c))return 'Lección: '+c;if(MC.some(m=>m.t===c))return 'Microcurso: '+c;if(c==='Proyecto final')return 'Proyecto final';if(CATG[c])return 'Práctica: '+c;return c;}
function tituloDe(r){if(!r)return '';const c=r.cat||'',l=LECC.find(x=>x.t===c);if(l)return 'Lección: '+l.t+' — '+l.act.t;const m=MC.find(x=>x.t===c);if(m)return 'Microcurso: '+m.t+' — '+m.act.t;if(c==='Proyecto final')return 'Proyecto final';return CATG[c]?'Práctica ('+c+'): '+(r.texto||'').slice(0,40).replace(/\s+\S*$/,'')+'…':'';}
function relMic(r){if(!r)return [];const c=r.cat||'',l=LECC.find(x=>x.t===c);let ids=[];if(l)ids=REL[l.id]||[];else{const m=MC.find(x=>x.t===c);if(m)ids=MC.filter(x=>x.id!==m.id&&x.sk.some(k=>m.sk.includes(k))).slice(0,3).map(x=>x.id);else if(c==='Proyecto final')ids=['m13','m27','m16'];else ids=PMC[c]||[];}return ids.map(id=>MC.find(m=>m.id===id)).filter(Boolean);}
function relReto(r){const a=relMic(r);return a.length?`<div style='margin-top:10px'><span class='m'>Microcursos que te ayudan:</span><br>${a.map(m=>`<button class='lk rmc' data-m='${m.id}'>${esc(m.t)}</button>`).join('')}</div>`:'';}
function wireReto(t,ta){document.querySelectorAll('.rmc').forEach(b=>b.onclick=async()=>{if(palabras(ta.value)>0){const id=await guardarTexto({id:activeId,titulo:document.getElementById('titulo').value,genero:document.getElementById('genero').value,contenido:ta.value,feedback:t.feedback,skills:t.skills,fuente:t.fuente,reto:t.reto||retoActivo,carpetaId:document.getElementById('proy').value||null,fecha:t.fecha});activeId=id;}switchTab('microcursos');abrirMicro(b.dataset.m);});}

 document.getElementById('view').innerHTML=`<div class='m' style='color:var(--accent)'>Microcursos</div><h1 class='greet serif'>Estudia cada habilidad por separado</h1><p class='m' style='margin:-10px 0 16px'>Cada microcurso profundiza en una faceta concreta del oficio. Ideales para reforzar justo lo que necesitas.</p><div class='prog'><i style='width:${done/MC.length*100}%'></i></div><div class='sec-title'>${done} de ${MC.length} completados</div><div class='chips'>${fl.map(f=>`<button class='chip ${f[0]===mFiltro?'active':''}' data-f='${f[0]}'>${f[1]}</button>`).join('')}</div><div class='sec-title'>${lista.length} ${lista.length===1?'microcurso':'microcursos'}</div><div class='mgrid'>`+lista.map(m=>`<div class='mcard' data-m='${m.id}'><span class='chk ${prog['mc_'+m.id]?'on':''}' style='float:right'>${prog['mc_'+m.id]?'✓':''}</span><b class='serif' style='font-size:17px'>${esc(m.t)}</b><div class='m' style='margin:4px 0 8px'>${m.d}</div><div class='chipset'>${m.sk.map(k=>`<span class='tag'>${skl(k)}</span>`).join('')}<span class='tag'>${m.min} min</span></div></div>`).join('')+`</div>`;
 document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{mFiltro=b.dataset.f;renderMicro();});
 document.querySelectorAll('.mcard').forEach(c=>c.onclick=()=>abrirMicro(c.dataset.m));}
const SHL=['Estructura','Personajes','Diálogos','Emociones','Mundo','Ritmo','Voz','Ambiente','Tensión','Gramática'];

function perfilSkF(f){const an=anF(f);return SKILLS.map(([k,l])=>{const v=an.map(t=>t.skills[k]).filter(x=>typeof x==='number');return {k,l,v:v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):0,n:v.length};});}
function radarX(f){const an=anF(f);if(!an.length)return `<div class='notice'>${f==='local'?'Todavía no hay autoanálisis local guardado. Usa «Análisis local» o «Revisión guiada» en el editor.':'Todavía no hay análisis de este tipo.'}</div>`;
 const sk=perfilSkF(f),last=an[0].skills,pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/10;return [(170+Math.cos(a)*r).toFixed(1),(135+Math.sin(a)*r).toFixed(1)];};
 return `<svg class='chart' viewBox='0 0 340 270'>${[.25,.5,.75,1].map(g=>`<polygon class='grid' points='${sk.map((_,i)=>pt(i,g*88).join(',')).join(' ')}'/>`).join('')}${sk.map((_,i)=>`<line class='grid' x1='170' y1='135' x2='${pt(i,88)[0]}' y2='${pt(i,88)[1]}'/>`).join('')}<polygon class='area' points='${sk.map((s,i)=>pt(i,s.v/100*88).join(',')).join(' ')}'/><polygon class='areaU' points='${SKILLS.map((s,i)=>pt(i,(typeof last[s[0]]==='number'?last[s[0]]:0)/100*88).join(',')).join(' ')}'/>${SHL.map((l,i)=>{const q=pt(i,104),c=Math.cos(-Math.PI/2+i*2*Math.PI/10);return `<text x='${q[0]}' y='${q[1]}' font-size='9.5' text-anchor='${c>.3?'start':c<-.3?'end':'middle'}' dominant-baseline='middle' fill='currentColor' opacity='.8'>${l}</text>`;}).join('')}</svg><div class='leyenda'><span><i class='lg1'></i>Promedio (${an.length} ${an.length===1?'texto':'textos'})</span><span><i class='lg2'></i>Último texto</span></div>`;}
function radarCtl(){const f=iniF();return `<div class='chips'>${[['local','Autoanálisis local'],['todos','Todos']].map(c=>`<button class='chip rf ${f===c[0]?'active':''}' data-f='${c[0]}'>${c[1]}</button>`).join('')}</div>${radarX(f)}`;}

MI('m28',10,'Acotaciones y acción: el diálogo en escena','Anclar las voces en un lugar y en cuerpos que se mueven.',['dialogos','ritmo y pacing'],`<p>Un diálogo no ocurre en el vacío: las voces están en un lugar, entre cuerpos que se mueven. Las acotaciones y la acción lo anclan en la escena.</p><h3>Qué aportan las acotaciones</h3><ol><li><b>Ritmo:</b> una acción entre dos réplicas marca una pausa.</li><li><b>Subtexto:</b> el gesto contradice o matiza la palabra («—Estoy bien —dijo, y apartó la mirada»).</li><li><b>Orientación:</b> aclaran quién habla sin recurrir a verbos rebuscados.</li></ol><h3>Cómo dosificarlas</h3><p>Usa «dijo» cuando solo necesites identificar. Usa una acción cuando quieras añadir sentido. Si hablan dos personas, a menudo basta con alternar las líneas sin etiquetar.</p><h3>Cuidado con</h3><ul><li>Acciones decorativas sin función («sonrió, asintió, suspiró»).</li><li>Acotaciones que repiten lo que dice la réplica.</li><li>Párrafos de acción que sepultan la conversación.</li></ul><blockquote>Una buena acotación calla lo que la palabra no puede decir.</blockquote>`,{t:'Gestos que hablan',d:'m',s:'Combina palabra y acción.',c:'Escribe un diálogo de 150 palabras entre dos personas que se despiden. Cada tres réplicas, incluye una acción que contradiga o matice lo que se dice.'}),
MI('m29',10,'Estilo indirecto y resumen: cuándo no citar','Reservar el diálogo directo para lo que importa.',['dialogos','ritmo y pacing'],`<p>No toda conversación merece ser citada. Resumir lo irrelevante y reservar el diálogo directo para lo que importa mejora el ritmo.</p><h3>Tres formas de contar lo hablado</h3><ol><li><b>Directo:</b> «—Me voy —dijo ella».</li><li><b>Indirecto:</b> «Dijo que se iba».</li><li><b>Resumen:</b> «Hablaron una hora de nada y de todo».</li></ol><h3>Cuándo elegir cada uno</h3><p>Usa el directo para los momentos de conflicto, revelación o carácter. Usa el indirecto o el resumen para transiciones, información conocida o conversaciones repetitivas.</p><h3>Combinarlos</h3><p>Dentro de una misma escena puedes resumir el comienzo y pasar al directo cuando sube la tensión: el lector siente el cambio de ritmo.</p><h3>Errores comunes</h3><ul><li>Citar saludos y trámites que no aportan nada.</li><li>Resumir la discusión central, que merecía la escena.</li></ul><blockquote>Cita lo que duele; resume lo que pasa.</blockquote>`,{t:'Directo o resumen',d:'m',s:'Decide qué citar y qué resumir.',c:'Escribe 180 palabras de una reunión familiar: resume en indirecto lo trivial y reserva el diálogo directo para un único momento de tensión.'}),
MI('m30',11,'Diálogos de grupo: varias voces en una escena','Orientar al lector y dar a cada voz su lugar.',['dialogos','personajes'],`<p>Una conversación entre cuatro personas es más difícil que entre dos: hay que orientar al lector y dar a cada voz su lugar sin que parezca una obra de teatro.</p><h3>Cómo manejarlas</h3><ol><li><b>Elige un centro:</b> decide quién conduce la escena o desde qué mirada se ve.</li><li><b>Voces distinguibles:</b> cada uno con su ritmo, vocabulario y manera de interrumpir.</li><li><b>Gestos y posiciones:</b> ubica a cada personaje en el espacio para orientar al lector.</li></ol><h3>Subgrupos y apartes</h3><p>Dentro del grupo hay alianzas y tensiones: dos que se miran, uno que calla, otro que cambia de tema. Esas dinámicas cuentan más que las réplicas.</p><h3>Controlar la cantidad</h3><p>No todos deben hablar en todo momento. El silencio de un personaje puede ser lo más elocuente de la escena.</p><h3>Cuidado con</h3><ul><li>Tantas intervenciones que el lector pierda el hilo.</li><li>Que todos suenen igual y solo cambien los nombres.</li></ul><blockquote>En un grupo, lo que no dice uno lo grita otro.</blockquote>`,{t:'La mesa de cuatro',d:'d',s:'Escribe una conversación con cuatro voces.',c:'Escribe una cena de 220 palabras con cuatro personajes. Cada uno con una voz distinta y un objetivo propio, y que el lector note una alianza y una tensión sin explicarlas.'}),
MI('m31',10,'Emociones contradictorias y ambivalencia','Querer algo y temerlo: lo que vuelve humano a un personaje.',['descripcion de emociones','personajes'],`<p>Casi nunca sentimos una sola emoción a la vez. La ambivalencia (querer algo y temerlo, amar y resentir) vuelve humano a un personaje.</p><h3>Cómo mostrarla</h3><ol><li><b>Gesto contra palabra:</b> dice que sí mientras retrocede un paso.</li><li><b>Acción interrumpida:</b> empieza a marcar el número y cuelga.</li><li><b>Detalle que traiciona:</b> sonríe, pero le tiembla la taza.</li></ol><h3>No la resuelvas pronto</h3><p>La contradicción es interesante mientras dura. Dejar que el personaje dude y elija con costo da fuerza a la decisión.</p><h3>Un ejemplo</h3><p>«Ayudó a su hermano a cargar la mudanza y, cuando él no miraba, se guardó en el bolsillo la llave de la casa vieja.» Alegría y duelo conviven sin nombrarse.</p><h3>Cuidado</h3><ul><li>Explicar la ambivalencia («sentía dos cosas a la vez»).</li><li>Que ambas emociones suenen igual de intensas y se cancelen.</li></ul><blockquote>El corazón rara vez vota por unanimidad.</blockquote>`,{t:'Dos sentimientos',d:'d',s:'Muestra una emoción doble sin nombrarla.',c:'Escribe 150 palabras de un personaje que se despide de un lugar que quería dejar y a la vez amaba. Muestra ambas emociones con gestos y objetos, sin nombrarlas.'}),
MI('m32',11,'Mostrar el duelo y la pérdida','Contención y detalle para escribir lo más difícil.',['descripcion de emociones'],`<p>El duelo se vive en lo cotidiano más que en los grandes gestos. Escribirlo bien exige contención y detalle.</p><h3>Cómo se muestra</h3><ol><li><b>Objetos que quedan:</b> la taza, el abrigo, el lugar vacío en la mesa.</li><li><b>Rutinas rotas:</b> preparar café para dos por costumbre.</li><li><b>Pequeñas ausencias:</b> el silencio de un teléfono que ya no suena.</li></ol><h3>Contención</h3><p>Cuanto más grande el dolor, menos adjetivos necesita. Una frase simple y un detalle exacto pesan más que un párrafo de lamentos.</p><h3>Lo solemne y lo absurdo</h3><p>En el duelo real conviven ambos: se discute por la comida del velorio. Esos contrastes dan verdad al texto.</p><h3>Evita</h3><ul><li>Explicar el dolor («estaba destrozada»).</li><li>Frases hechas: «un vacío en el pecho», «el mundo se detuvo».</li></ul><blockquote>El dolor se reconoce en los detalles que sobreviven.</blockquote>`,{t:'Lo que queda',d:'d',s:'Muestra una pérdida con objetos.',c:'Escribe 180 palabras sobre alguien que ordena las cosas de una persona que ya no está. Que el dolor se vea solo en objetos y acciones, sin nombrarlo.'}),
MI('m33',10,'Miedo y ansiedad en el cuerpo','Llevar el miedo al cuerpo y a la percepción del personaje.',['descripcion de emociones','tension y conflicto'],`<p>El miedo es una de las emociones más corporales. Para que el lector lo sienta, hay que llevarlo al cuerpo y a la percepción del personaje.</p><h3>Señales útiles</h3><ol><li><b>Respiración:</b> corta, contenida, que se oye demasiado.</li><li><b>Atención estrechada:</b> solo ve la puerta, solo oye el pasillo.</li><li><b>Tiempo alterado:</b> los segundos se estiran o se saltan.</li></ol><h3>Ansiedad: el miedo sin objeto</h3><p>Se muestra con pensamientos que se repiten, acciones inútiles (revisar la cerradura tres veces) y un cuerpo que no se relaja.</p><h3>Ritmo y frases</h3><p>Frases cortas, repetidas y entrecortadas aceleran la lectura. Úsalas en el pico y alarga la frase en la calma que lo precede.</p><h3>Cuidado</h3><ul><li>Una lista de síntomas sin contexto.</li><li>Las frases hechas («el corazón le latía con fuerza»).</li></ul><blockquote>El miedo cabe en lo que el personaje ya no puede dejar de mirar.</blockquote>`,{t:'Lo que no deja de mirar',d:'m',s:'Estrecha la atención del personaje.',c:'Escribe 150 palabras de alguien que escucha pasos en el pasillo. Muestra el miedo solo con su respiración, lo que mira y cómo cambia el tiempo, sin nombrarlo.'}),
MI('m34',10,'Clima, luz y estaciones como atmósfera','Usar el tiempo y la luz para marcar el ánimo de la escena.',['descripcion y ambientacion'],`<p>El clima no es solo fondo: marca el ánimo, acelera o frena la escena y puede reflejar o contradecir lo que siente el personaje.</p><h3>Tres usos</h3><ol><li><b>Eco:</b> el clima acompaña la emoción (lluvia y tristeza).</li><li><b>Contraste:</b> un sol radiante en el peor día.</li><li><b>Presión:</b> el calor o el frío vuelven difícil la acción.</li></ol><h3>La luz</h3><p>La hora y el tipo de luz definen la atmósfera: el mediodía duro, el atardecer dorado, la penumbra de una cocina con una sola bombilla.</p><h3>Estaciones y tiempo</h3><p>Una estación sugiere un ciclo: el otoño de las despedidas, el verano de lo posible. Úsalas como pistas, no como etiquetas.</p><h3>Evita</h3><ul><li>Empezar siempre con el tiempo meteorológico.</li><li>El cliché de la lluvia en los funerales.</li></ul><blockquote>El clima es un personaje que no necesita diálogo.</blockquote>`,{t:'El mismo día, otra luz',d:'m',s:'Cambia la atmósfera con el clima.',c:'Describe en 150 palabras una misma calle dos veces: bajo una luz de mediodía y bajo una tormenta. Que la atmósfera cambie sin nombrar emociones.'}),
MI('m35',10,'Espacios cerrados y abiertos: la geografía de la escena','Elegir dónde ocurre una escena es decidir qué presión sentirán los personajes.',['descripcion y ambientacion','tension y conflicto'],`<p>El tipo de espacio condiciona lo que puede pasar. Elegir dónde ocurre una escena es decidir qué presión sentirán los personajes.</p><h3>Espacios cerrados</h3><p>Un ascensor, una cocina, un coche: concentran la tensión, obligan a la cercanía y limitan la salida. Son ideales para confrontaciones.</p><h3>Espacios abiertos</h3><p>Una llanura, una playa: dan sensación de libertad o de desamparo. La vastedad puede hacer sentir pequeño al personaje.</p><h3>Umbrales</h3><p>Puertas, pasillos, ventanas, escaleras: son lugares de cambio. Un personaje que se detiene en el umbral está a punto de decidir.</p><h3>Cómo orientar al lector</h3><ol><li>Da pronto una imagen general del espacio.</li><li>Ubica a los personajes en él.</li><li>Recuerda un detalle clave cuando importe.</li></ol><blockquote>El espacio es el primer obstáculo de cualquier escena.</blockquote>`,{t:'Un lugar que presiona',d:'m',s:'Elige un espacio que condicione la escena.',c:'Escribe 180 palabras de una discusión en un espacio cerrado (ascensor, coche, baño). Que el espacio aumente la tensión y limite lo que los personajes pueden hacer.'}),
MI('m36',10,'Ciudad y paisaje: describir lugares reales','Elegir la mirada, no hacer una guía turística.',['descripcion y ambientacion','worldbuilding'],`<p>Describir una ciudad o un paisaje real exige elegir: no es un mapa ni una guía turística, es la mirada de alguien en un lugar.</p><h3>De lo general a lo particular</h3><p>Empieza con una imagen amplia que oriente (la ciudad desde un puente) y baja a un detalle que la vuelva única (el olor a pan a las seis).</p><h3>Lo que el lugar tiene de propio</h3><ol><li><b>Ritmo:</b> cómo camina y cómo suena la gente.</li><li><b>Detalles locales:</b> comidas, modismos, objetos cotidianos.</li><li><b>Memoria:</b> lo que el lugar le recuerda al personaje.</li></ol><h3>Evitar la postal</h3><p>Los monumentos y las vistas famosas son tópicos. Lo vivo está en lo cotidiano: una esquina, una cola, un patio.</p><h3>Veracidad</h3><p>Si escribes sobre un lugar real, comprueba lo esencial, pero no caigas en el dato exhaustivo: la emoción pesa más que la exactitud.</p><blockquote>Un lugar se describe con lo que el personaje ama u odia de él.</blockquote>`,{t:'Mi esquina',d:'m',s:'Describe un lugar real con intención.',c:'Describe en 180 palabras una esquina o un barrio que conozcas bien, a través de lo que notaría alguien que acaba de volver tras años de ausencia.'}),
MI('m37',11,'Subtramas: historias dentro de la historia','Líneas secundarias que enriquecen la trama principal.',['estructura narrativa'],`<p>Una subtrama es una línea secundaria que enriquece la principal. En una novela larga evita la monotonía y profundiza en los personajes y los temas.</p><h3>Para qué sirven</h3><ol><li><b>Contraste:</b> reflejan o contradicen el tema central.</li><li><b>Respiro:</b> alivian la tensión de la trama principal.</li><li><b>Profundidad:</b> desarrollan a los personajes secundarios.</li></ol><h3>Cómo integrarlas</h3><p>Cruza las subtramas con la principal en puntos clave. Una subtrama que no toca nunca la principal parece relleno.</p><h3>Cuántas</h3><p>En un cuento, casi ninguna; en una novela, una o dos bien desarrolladas valen más que cinco a medias.</p><h3>Cierre</h3><p>Cada subtrama necesita su propia resolución, idealmente antes o junto al clímax principal.</p><blockquote>Una subtrama bien tejida hace más hondo el tema central.</blockquote>`,{t:'Dos hilos',d:'d',s:'Diseña una subtrama que cruce la principal.',c:'Escribe en 180 palabras la trama principal de una historia y una subtrama que la contraste. Indica en qué dos puntos se cruzan y cómo cierra cada una.'}),
MI('m38',10,'Nombrar personajes y lugares','El nombre es el primer retrato: cómo elegirlo con intención.',['worldbuilding','estilo y voz'],`<p>Un nombre es el primer retrato de un personaje o de un lugar. Elegirlo con intención ayuda a la memoria y al tono.</p><h3>Criterios</h3><ol><li><b>Época y lugar:</b> los nombres tienen origen y moda.</li><li><b>Sonido:</b> un nombre corto y duro suena distinto de uno largo y suave.</li><li><b>Distinguibilidad:</b> evita nombres que empiecen igual o suenen parecido.</li></ol><h3>En mundos inventados</h3><p>Crea nombres con coherencia: familias de sonidos por cultura y reglas simples. Evita los apóstrofes y la «x» puestos solo por decorar.</p><h3>Apodos y significado</h3><p>Un apodo puede revelar cómo lo ven los demás. Un significado oculto puede enriquecer sin explicarse.</p><h3>Una prueba</h3><p>Lee en voz alta tres frases con el nombre: si cansa o confunde, cámbialo.</p><blockquote>Un buen nombre se recuerda sin esfuerzo.</blockquote>`,{t:'Cinco nombres',d:'f',s:'Elige nombres con intención.',c:'Crea cinco personajes (dos con nombre real y tres de un mundo inventado) y explica en una línea por qué elegiste cada nombre.'}),
MI('m39',11,'Escenas de acción: claridad y velocidad','Que el lector entienda qué pasa y sienta la velocidad.',['ritmo y pacing','tension y conflicto'],`<p>En una escena de acción, el lector necesita entender qué pasa y sentir la velocidad. Ambas cosas se logran con claridad más que con adornos.</p><h3>Principios</h3><ol><li><b>Claridad espacial:</b> ubica a cada personaje antes de moverlo.</li><li><b>Verbos fuertes:</b> «saltó», «golpeó», «cayó», en lugar de adjetivos.</li><li><b>Frases cortas:</b> aceleran el ritmo; las largas lo frenan.</li></ol><h3>Foco en la consecuencia</h3><p>No cuentes cada golpe: elige los que cambian algo y deja que los demás pasen rápido. Importa lo que se gana o se pierde.</p><h3>Sentidos y emoción</h3><p>Entre las acciones, un detalle sensorial o una reacción interna (el sabor a metal, el pitido en los oídos) da peso humano a la escena.</p><h3>Evita</h3><ul><li>Coreografías confusas sin orientación.</li><li>Descripciones largas en medio del peligro.</li></ul><blockquote>La acción se lee rápido porque se escribió con precisión.</blockquote>`,{t:'Veinte segundos',d:'d',s:'Escribe una acción clara y veloz.',c:'Escribe 180 palabras de una persecución o una pelea de veinte segundos. Ubica bien el espacio, usa verbos fuertes y frases cortas, y deja una consecuencia clara al final.'}));

MC.push(
MI('m40',10,'Terror y gótico: la atmósfera del miedo','Que la espera asuste más que el susto.',['tension y conflicto','descripcion y ambientacion'],`<p>El terror no vive del susto sino de la espera. Lo que el lector imagina asusta más que lo que se le muestra.</p><h3>Recursos</h3><ol><li><b>Lo insinuado:</b> un ruido, una sombra, una puerta entreabierta.</li><li><b>Lo cotidiano alterado:</b> algo familiar que ya no encaja.</li><li><b>El espacio:</b> casas, pasillos y sótanos que parecen vigilar.</li></ol><h3>Ritmo</h3><p>Alarga la calma, acorta la frase en el pico y no muestres al monstruo demasiado pronto.</p><h3>Evita</h3><ul><li>Explicarlo todo.</li><li>Sustos sin consecuencias.</li></ul><blockquote>Lo que no se ve, crece.</blockquote>`,{t:'Algo no encaja',d:'m',s:'Crea inquietud con un detalle.',c:'Escribe 150 palabras de alguien que vuelve a casa y nota que un objeto está fuera de lugar. Sin monstruos ni sangre: solo inquietud creciente.'}),
MI('m41',10,'Romance: la tensión entre dos personas','El interés nace de lo que separa a los personajes.',['personajes','tension y conflicto'],`<p>Una historia de amor necesita lo mismo que cualquier historia: deseo y obstáculo. El interés nace de lo que separa a los personajes.</p><h3>Claves</h3><ol><li><b>Deseo claro:</b> qué quiere cada uno del otro y de sí mismo.</li><li><b>Obstáculo real:</b> miedo, deber, secreto o diferencia.</li><li><b>Química en los detalles:</b> miradas, silencios y pequeños gestos.</li></ol><h3>Ritmo</h3><p>Acerca y aleja a los personajes: cada avance debe costar algo.</p><h3>Evita</h3><ul><li>Declaraciones que lo resuelven todo.</li><li>Obstáculos que un buen diálogo habría evitado.</li></ul><blockquote>El amor se nota en lo que cuesta decirlo.</blockquote>`,{t:'Casi se dicen',d:'m',s:'Escribe un acercamiento con obstáculo.',c:'Escribe 150 palabras de dos personas que quieren decirse algo y no pueden. Muestra el deseo y el obstáculo solo con gestos y diálogo indirecto.'}),
MI('m42',10,'Literatura infantil y juvenil: voz y claridad','Escribir claro, con respeto por la inteligencia del joven lector.',['estilo y voz','personajes'],`<p>Escribir para jóvenes no es escribir simple: es escribir claro, con respeto por su inteligencia y su mirada.</p><h3>Claves</h3><ol><li><b>Voz cercana:</b> frases directas, sin condescendencia.</li><li><b>Protagonista con agencia:</b> actúa y decide, no solo observa.</li><li><b>Emoción honesta:</b> temas serios tratados con verdad.</li></ol><h3>Estilo</h3><p>Imágenes concretas, ritmo ágil y humor son aliados. La brevedad ayuda; el sermón, no.</p><h3>Evita</h3><ul><li>Moralejas explícitas.</li><li>Adultos que lo resuelven todo.</li></ul><blockquote>Los jóvenes detectan la mentira antes que nadie.</blockquote>`,{t:'Aventura de bolsillo',d:'m',s:'Escribe una escena para un lector joven.',c:'Escribe 150 palabras de una escena de aventura para lectores de 10 a 12 años: protagonista activo, voz cercana y una emoción honesta.'}),
MI('m43',11,'Distopías: mundos que advierten','Exagerar una tendencia real para hacerla visible.',['worldbuilding','tension y conflicto'],`<p>Una distopía exagera una tendencia real para hacerla visible. Su fuerza está en lo reconocible.</p><h3>Cómo construirla</h3><ol><li><b>Una tendencia:</b> vigilancia, desigualdad, consumo, control.</li><li><b>Sus consecuencias:</b> cómo cambian el trabajo, el lenguaje y el amor.</li><li><b>Una grieta:</b> un personaje que empieza a dudar.</li></ol><h3>Mostrar el sistema</h3><p>Hazlo a través de la vida diaria, no de discursos: reglas absurdas que todos obedecen sin pensar.</p><h3>Evita</h3><ul><li>Villanos de caricatura.</li><li>Un mundo sin esperanza ni humanidad.</li></ul><blockquote>La mejor distopía se parece demasiado al presente.</blockquote>`,{t:'Un día normal',d:'d',s:'Muestra una distopía por lo cotidiano.',c:'Escribe 180 palabras de la mañana de un personaje en un mundo donde se haya exagerado una tendencia actual. Que el lector deduzca las reglas sin explicaciones.'}),
MI('m44',10,'Sátira y humor negro','Exagerar para señalar, con puntería.',['estilo y voz','tension y conflicto'],`<p>La sátira ataca un vicio o una costumbre exagerándolos. El humor negro hace reír de lo que duele. Ambos exigen puntería.</p><h3>Recursos</h3><ol><li><b>Exageración lógica:</b> llevar una idea hasta el absurdo.</li><li><b>Tono serio:</b> la cara de piedra aumenta el efecto.</li><li><b>Blanco claro:</b> saber a quién o qué se critica.</li></ol><h3>Cuidado</h3><p>Se critica el poder y la conducta, no a los débiles. Si el chiste necesita aclaración, falló.</p><h3>Evita</h3><ul><li>Ensañarse sin propósito.</li><li>Confundir el insulto con la sátira.</li></ul><blockquote>La sátira dice una verdad con cara de mentira.</blockquote>`,{t:'Con cara seria',d:'m',s:'Exagera una costumbre hasta el absurdo.',c:'Escribe 150 palabras que describan, con tono muy serio, una costumbre actual (la reunión inútil, el selfie) llevada a un extremo absurdo y coherente.'}),
MI('m45',10,'Narrar en segunda persona','El «tú» que interpela al lector.',['estilo y voz','estructura narrativa'],`<p>«Abres la puerta y sabes que algo cambió.» La segunda persona interpela al lector y crea intimidad o presión.</p><h3>Cuándo funciona</h3><ol><li><b>Instrucciones o rituales:</b> el «tú» guía una acción.</li><li><b>Autoacusación:</b> el narrador se habla a sí mismo.</li><li><b>Inmersión:</b> el lector es el personaje.</li></ol><h3>Riesgos</h3><p>Cansa en tramos largos y puede sonar a manual. Úsala en textos breves o en fragmentos con intención clara.</p><h3>Evita</h3><ul><li>Decirle al lector lo que siente sin motivo.</li><li>Mantenerla sin razón narrativa.</li></ul><blockquote>El «tú» obliga a quien lee a quedarse dentro.</blockquote>`,{t:'Tú, ahora',d:'m',s:'Escribe una escena en segunda persona.',c:'Escribe 150 palabras en segunda persona sobre alguien que llega tarde a un lugar importante. Mantén un tono que justifique el «tú».'}),
MI('m46',10,'Guion y teatro breve: la escena hablada','Contar solo con lo que se dice y se hace.',['dialogos','estructura narrativa'],`<p>En el guion y el teatro todo se cuenta con lo que se dice y se hace: no hay narrador que explique.</p><h3>Claves</h3><ol><li><b>Acción visible:</b> solo lo que se ve y se oye.</li><li><b>Diálogo con propósito:</b> cada réplica busca algo.</li><li><b>Escena breve:</b> entrar tarde y salir pronto.</li></ol><h3>Formato básico</h3><p>Las indicaciones van en cursiva o entre paréntesis, y el nombre del personaje antes de su réplica.</p><h3>Evita</h3><ul><li>Pensamientos que nadie puede ver.</li><li>Indicaciones demasiado largas.</li></ul><blockquote>Lo que no se ve ni se oye, no existe.</blockquote>`,{t:'Dos personajes, una puerta',d:'m',s:'Escribe una escena teatral breve.',c:'Escribe una escena de 150 palabras para teatro entre dos personajes y una puerta cerrada. Solo diálogo y acotaciones visibles.'}),
MI('m47',11,'Autoficción y memoria: escribir sobre la propia vida','Elegir qué recuerdo sirve a una historia y darle forma.',['estilo y voz','descripcion de emociones'],`<p>Escribir sobre uno mismo no es contarlo todo: es elegir qué recuerdo sirve a una historia y darle forma.</p><h3>Claves</h3><ol><li><b>Un recuerdo concreto:</b> una escena, no una vida.</li><li><b>Distancia:</b> mirar al «yo» pasado como a un personaje.</li><li><b>Verdad emocional:</b> en ficción puede cambiar un dato si se conserva lo esencial.</li></ol><h3>Cuidado</h3><p>Los recuerdos son imperfectos y a veces hieren a otros. Decide qué publicarás y qué guardarás.</p><h3>Evita</h3><ul><li>Justificarte o ajustar cuentas.</li><li>Resumir en lugar de escenificar.</li></ul><blockquote>La memoria no archiva: inventa con fidelidad.</blockquote>`,{t:'Un recuerdo como escena',d:'m',s:'Convierte un recuerdo en escena.',c:'Elige un recuerdo breve y escríbelo en 180 palabras como una escena: lugar, gestos, diálogo y un detalle que solo tú recordarías.'}),
MI('m48',10,'Investigar para ficción: precisión sin lección','Datos exactos que dan credibilidad sin volverse clase.',['worldbuilding','descripcion y ambientacion'],`<p>Un dato exacto da credibilidad, pero un exceso de datos convierte la historia en una clase.</p><h3>Cómo investigar</h3><ol><li><b>Pregunta qué necesita la escena:</b> investiga solo eso.</li><li><b>Busca detalles de vida:</b> olores, herramientas, jerga.</li><li><b>Habla con quien sabe:</b> una anécdota vale más que un artículo.</li></ol><h3>Cómo usarlo</h3><p>Muestra los datos a través de los personajes y la acción, y deja fuera el resto.</p><h3>Evita</h3><ul><li>Volcar todo lo que investigaste.</li><li>Errores en lo esencial.</li></ul><blockquote>Investiga mucho; cuenta poco.</blockquote>`,{t:'El dato justo',d:'m',s:'Integra un dato real en la acción.',c:'Elige un oficio que no conozcas, investiga tres datos y escribe 150 palabras de una escena donde esos datos aparezcan en la acción, sin explicarlos.'}),
MI('m49',10,'Ritmo en el verso: acento, pausa y respiración','El verso se mide en sílabas, pero se siente en acentos y pausas.',['ritmo y pacing','estilo y voz'],`<p>El verso se mide en sílabas, pero se siente en acentos y pausas.</p><h3>Elementos</h3><ol><li><b>Acento:</b> las sílabas fuertes marcan el pulso.</li><li><b>Cesura:</b> una pausa dentro del verso que lo parte en dos.</li><li><b>Encabalgamiento:</b> la frase pasa al verso siguiente y crea tensión.</li></ol><h3>Cómo probarlo</h3><p>Lee el poema en voz alta y marca dónde respiras: si no coincide con los versos, ahí hay material para trabajar.</p><h3>Evita</h3><ul><li>Rellenar para completar la medida.</li><li>Un ritmo monótono, sin variaciones.</li></ul><blockquote>El poema respira donde el verso se corta.</blockquote>`,{t:'Respirar el verso',d:'m',s:'Controla el ritmo con cortes de verso.',c:'Escribe seis versos y léelos en voz alta. Cambia dos cortes de verso (encabalgamientos) y anota cómo cambia la respiración.'}),
MI('m50',10,'Cartas y epístolas: la voz que escribe a alguien','Quien escribe habla distinto según a quién se dirige.',['estilo y voz','estructura narrativa'],`<p>Una carta tiene destinatario: quien escribe habla distinto según a quién se dirige. Eso la vuelve íntima y reveladora.</p><h3>Claves</h3><ol><li><b>Destinatario claro:</b> define la relación y el tono.</li><li><b>Motivo:</b> por qué escribe ahora.</li><li><b>Lo que calla:</b> el subtexto entre líneas.</li></ol><h3>En la ficción</h3><p>Una carta puede revelar un secreto, contar un hecho desde otra mirada o mostrar la distancia entre dos personas.</p><h3>Evita</h3><ul><li>Cartas que informan al lector como si fuera un manual.</li><li>Una voz idéntica a la del narrador.</li></ul><blockquote>Cada carta dice quién es el otro por cómo se le habla.</blockquote>`,{t:'Querida/o…',d:'m',s:'Escribe una carta con subtexto.',c:'Escribe una carta de 150 palabras de un personaje a alguien con quien tuvo un conflicto. Que se note lo que no se atreve a decir.'}));
