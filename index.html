<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pluma maestra">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Pluma maestra — tu asistente de escritura. Escribe, organiza proyectos y recibe feedback sobre tus textos.">
<meta name="theme-color" content="#F8F5F0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Pluma maestra — Asistente de escritura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6EEDD; --surface:#FFFFFF; --surface-2:#FBF5E8; --text:#241C12; --text-muted:#6E6250;
  --accent:#A33440; --accent-ink:#fff; --gold:#A6791C; --good:#3F7D4F; --border:#E6D9BC; --rule:rgba(36,28,18,.08);
  --radius:5px; --font-head:'Spectral',Georgia,serif; --font-body:'Inter',system-ui,-apple-system,sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#161C26;--surface:#212A38;--surface-2:#1B2330;--text:#EDE7DB;--text-muted:#98A1AF;--accent:#D9636F;--gold:#D9B24A;--good:#72C68B;--border:#303B4C;--rule:rgba(237,231,219,.08);}
}
:root[data-theme="dark"]{--bg:#161C26;--surface:#212A38;--surface-2:#1B2330;--text:#EDE7DB;--text-muted:#98A1AF;--accent:#D9636F;--gold:#D9B24A;--good:#72C68B;--border:#303B4C;--rule:rgba(237,231,219,.08);}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);-webkit-font-smoothing:antialiased;}
h1,h2,h3,.serif{font-family:var(--font-head);}
button{font-family:inherit;cursor:pointer;}
textarea,input,select{font-family:inherit;color:inherit;}
::selection{background:var(--accent);color:var(--accent-ink);}

#app{display:flex;flex-direction:column;min-height:100%;}
header{position:sticky;top:0;z-index:5;padding:calc(16px + env(safe-area-inset-top,0px)) 20px 14px;background:var(--bg);border-bottom:1px solid var(--rule);display:flex;align-items:baseline;gap:10px;}
header .logo{font-size:26px;font-style:italic;font-weight:600;letter-spacing:.2px;}
header .tag{font-size:12.5px;color:var(--text-muted);}

main{flex:1;max-width:640px;width:100%;margin:0 auto;padding:22px 20px 100px;}
.view{animation:enter .32s cubic-bezier(.2,.8,.2,1);}
@keyframes enter{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:var(--surface);border-top:1px solid var(--rule);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);}
nav .row{display:flex;max-width:640px;width:100%;}
nav button{flex:1;background:none;border:none;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--text-muted);font-size:12px;border-top:2px solid transparent;transition:color .2s,border-color .2s;}
nav button.active{color:var(--text);border-top-color:var(--accent);}
nav button .ic{font-size:19px;line-height:1;}

.btn,.cta-main,.chip,.folder-card,.recent-item{transition:transform .12s ease,box-shadow .12s ease;}
.btn:active,.cta-main:active,.chip:active,.folder-card:active,.recent-item:active{transform:scale(.97);}

.greet{font-size:30px;line-height:1.2;margin:4px 0 24px;max-width:22ch;}
.stat-row{display:flex;gap:28px;padding:18px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin-bottom:26px;}
.stat b{display:block;font-family:var(--font-head);font-size:28px;line-height:1;}
.stat span{font-size:12px;color:var(--text-muted);}
.cta-main{display:block;width:100%;background:var(--accent);color:var(--accent-ink);border:none;border-radius:var(--radius);padding:14px;font-size:15px;font-weight:600;margin-bottom:22px;}
.sec-title{font-size:13px;color:var(--text-muted);margin:0 0 10px;}
.recent-item{padding:12px 0;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;gap:12px;background:none;border-left:none;border-right:none;border-top:none;width:100%;text-align:left;color:inherit;}
.recent-item .t{font-weight:500;font-size:14.5px;}
.recent-item .m{font-size:12px;color:var(--text-muted);margin-top:2px;}
.empty{color:var(--text-muted);font-size:14px;padding:10px 0 20px;line-height:1.5;}
.notice{font-size:13px;color:var(--text-muted);background:var(--surface-2);border-radius:var(--radius);padding:11px 14px;margin:14px 0;}
.back-link{background:none;border:none;color:var(--text-muted);font-size:14px;padding:2px 0 14px;display:block;}

.btn-row{display:flex;gap:10px;margin:0 0 16px;}
.btn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:var(--radius);padding:11px 16px;font-size:14px;font-weight:500;flex:1;}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
.btn:disabled{opacity:.55;}
.pulsing{animation:pulse 1s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.45;}}

.folder-card{background:var(--surface);border-left:3px solid var(--fc,var(--gold));border-radius:0 var(--radius) var(--radius) 0;padding:16px 18px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.folder-card .t{font-weight:500;font-size:15px;}
.folder-card .m{font-size:12px;color:var(--text-muted);margin-top:2px;}
.folder-card .chev{color:var(--text-muted);font-size:18px;}

.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:5px;}
.field input[type=text],.field select{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;font-size:15px;color:var(--text);}
#contenido{width:100%;min-height:240px;resize:vertical;border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;font-family:var(--font-head);font-size:16.5px;line-height:28px;color:var(--text);background-color:var(--surface-2);background-image:repeating-linear-gradient(var(--surface-2) 0 27px,var(--rule) 27px 28px);}
.wc{text-align:right;font-size:11.5px;color:var(--text-muted);margin-top:6px;}
.fb-box{margin-top:16px;background:var(--surface-2);border-left:3px solid var(--accent);border-radius:0 var(--radius) var(--radius) 0;padding:16px 18px;font-size:14.5px;line-height:1.65;animation:enter .3s ease;}
.fb-box h4{margin:0 0 10px;font-size:12px;color:var(--text-muted);font-weight:500;}
.tip{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule);font-size:13.5px;line-height:1.5;}
.tip:last-child{border-bottom:none;}
.tip .dot{flex-shrink:0;width:7px;height:7px;border-radius:50%;margin-top:6px;background:var(--gold);}
.tip.ok .dot{background:var(--good);}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
.chip{border:1px solid var(--border);background:var(--surface);color:var(--text-muted);border-radius:20px;padding:7px 14px;font-size:13px;}
.chip.active{background:var(--text);color:var(--bg);border-color:var(--text);}
.ex-card{background:var(--surface);border-left:3px solid var(--gold);border-radius:0 var(--radius) var(--radius) 0;padding:20px;margin-bottom:18px;animation:enter .3s ease;}
.ex-card .cat{font-size:12px;color:var(--gold);margin-bottom:8px;}
.ex-card p{font-family:var(--font-head);font-size:18px;line-height:1.5;margin:0 0 16px;}

.toast{position:fixed;bottom:calc(78px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(16px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:30;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#menu-btn{background:none;border:none;font-size:22px;color:var(--text);padding:0 4px 0 0;align-self:center;}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);opacity:0;pointer-events:none;transition:opacity .25s;z-index:9;}
.menu-open #scrim{opacity:1;pointer-events:auto;}
nav{top:0;right:auto;width:272px;height:100%;z-index:10;flex-direction:column;justify-content:flex-start;border-top:none;border-right:1px solid var(--rule);transform:translateX(-102%);transition:transform .3s cubic-bezier(.2,.8,.2,1);}
.menu-open nav{transform:none;box-shadow:6px 0 24px rgba(0,0,0,.18);}
nav .row{flex-direction:column;max-width:none;padding-top:calc(64px + env(safe-area-inset-top,0px));}
nav button{flex:none;flex-direction:row;gap:14px;width:100%;padding:15px 24px;font-size:15px;border-top:none;border-left:3px solid transparent;}
nav button.active{border-left-color:var(--accent);background:var(--surface-2);}
nav button .ic{width:22px;text-align:center;}
.m{color:var(--text-muted);font-size:13px;}
.reto{background:var(--surface);border-left:3px solid var(--gold);padding:14px 16px;margin-bottom:16px;font-family:var(--font-head);font-size:16px;line-height:1.5;border-radius:0 var(--radius) var(--radius) 0;}
.reto b{display:block;font-family:var(--font-body);font-size:12px;color:var(--gold);font-weight:500;margin-bottom:4px;}
.prog{height:6px;background:var(--rule);border-radius:3px;overflow:hidden;margin-bottom:12px;}
.prog i{display:block;height:100%;background:var(--accent);transition:width .5s;}
.nodo{display:flex;align-items:center;gap:14px;padding:14px 16px;margin-bottom:10px;background:var(--surface);border-radius:var(--radius);transition:transform .12s;cursor:pointer;}
.nodo:active{transform:scale(.97);}
.nodo .num{width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:600;flex-shrink:0;}
.nodo.hecho .num{background:var(--good);}
.nodo.lock{opacity:.6;}.nodo.lock .num{background:var(--text-muted);}
.opt{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;font-size:15px;color:var(--text);transition:transform .12s,background .2s;}
.opt:active{transform:scale(.98);}
.opt:disabled{color:var(--text);opacity:1;}
.opt.bien{background:color-mix(in srgb,var(--good) 22%,var(--surface));border-color:var(--good);}
.opt.mal{background:color-mix(in srgb,var(--accent) 22%,var(--surface));border-color:var(--accent);animation:shake .3s;}
@keyframes shake{25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
.medal{font-size:76px;text-align:center;animation:pop .55s cubic-bezier(.3,1.6,.5,1);}
@keyframes pop{from{transform:scale(0);}to{transform:scale(1);}}
.links{display:flex;gap:14px;}.links a,.ref{color:var(--accent);font-size:14px;font-weight:500;text-decoration:none;}
.ref{display:block;padding:11px 0;border-bottom:1px solid var(--rule);}
.ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;}
.dotp{fill:var(--accent);}
.grid{fill:none;stroke:var(--rule);stroke-width:1;}
.area{fill:var(--accent);fill-opacity:.2;stroke:var(--accent);stroke-width:1.6;}
.bar{fill:var(--gold);}
.chart{width:100%;height:auto;display:block;}
.card{background:var(--surface);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px;}
.card h3{margin:0 0 10px;font-size:17px;}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
.kpi{background:var(--surface);border-radius:var(--radius);padding:12px 14px;}
.kpi b{display:block;font-family:var(--font-head);font-size:24px;margin-top:2px;}
.sk{display:flex;justify-content:space-between;font-size:12.5px;margin:9px 0 4px;}
.blk{font-size:18px;font-weight:600;margin:24px 0 10px;}
.badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:10px;background:var(--surface-2);color:var(--text-muted);}
.b0{background:color-mix(in srgb,var(--good) 20%,var(--surface));color:var(--good);}
.b1{background:color-mix(in srgb,var(--gold) 20%,var(--surface));color:var(--gold);}
.b2{background:color-mix(in srgb,var(--accent) 18%,var(--surface));color:var(--accent);}
.tag{font-size:11.5px;border:1px solid var(--border);border-radius:12px;padding:3px 9px;color:var(--text-muted);}
.chipset{display:flex;gap:6px;flex-wrap:wrap;}
.lnav{display:flex;justify-content:space-between;}
.lesson{font-family:var(--font-head);font-size:16.5px;line-height:1.65;}
.lesson h3{font-size:19px;margin:20px 0 6px;}
.lesson p{margin:0 0 10px;}
.lesson ol{padding-left:20px;}
.lesson li{margin-bottom:8px;}
.lesson blockquote{margin:14px 0;padding-left:14px;border-left:2px solid var(--accent);font-style:italic;color:var(--text-muted);}
.consigna{background:var(--surface-2);border-radius:var(--radius);padding:9px 12px;margin:8px 0;font-size:13px;}
.chk{flex-shrink:0;width:22px;height:22px;border-radius:50%;border:2px solid var(--border);background:none;color:var(--accent-ink);font-size:13px;margin-top:2px;}
.chk.on{background:var(--good);border-color:var(--good);}
.mgrid{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:12px;}
@media(min-width:620px){.mgrid{grid-template-columns:1fr 1fr;}}
.mcard{background:var(--surface);border-radius:var(--radius);padding:16px;cursor:pointer;transition:transform .12s;}
.mcard:active{transform:scale(.97);}
.mcard .chk{display:grid;place-items:center;}
.hero{background:var(--surface);border-radius:var(--radius);padding:22px 20px;margin-bottom:16px;}
.hero .kick{font-size:13px;color:var(--accent);margin-bottom:2px;}
.hero h1{font-size:34px;margin:0 0 10px;line-height:1.1;}
.hero p{margin:0 0 14px;font-size:14.5px;line-height:1.5;color:var(--text-muted);}
.hero .btn-row{margin:0;flex-wrap:wrap;}
.kpi{cursor:pointer;transition:transform .12s;}
.kpi:active{transform:scale(.97);}
.ring{position:relative;width:96px;height:96px;margin:0 auto 8px;}
.ring svg{transform:rotate(-90deg);}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-head);font-size:22px;font-weight:600;}
.ringc{stroke:var(--accent);stroke-dasharray:var(--c);stroke-dashoffset:var(--o);animation:ringa 1.1s ease-out;}
@keyframes ringa{from{stroke-dashoffset:var(--c);}to{stroke-dashoffset:var(--o);}}
.namebtn{background:none;border:none;color:var(--text-muted);font-size:12px;padding:0;text-decoration:underline;}
:root{--bg:#F8F5F0;--surface:#FFFFFF;--surface-2:#F3EEE6;--text:#2B2219;--text-muted:#7B6F62;--accent:#9A5B2F;--accent-ink:#fff;--gold:#B07F36;--good:#4F8A62;--border:#EBE3D6;--rule:rgba(60,40,20,.07);--radius:14px;--sh:0 1px 2px rgba(60,40,20,.04),0 6px 20px rgba(60,40,20,.06);}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1A1714;--surface:#25211D;--surface-2:#201C19;--text:#EFE8DE;--text-muted:#A39A8E;--accent:#D9955B;--gold:#D9B061;--good:#78C28E;--border:#35302A;--rule:rgba(239,232,222,.08);--sh:0 1px 2px rgba(0,0,0,.2),0 6px 20px rgba(0,0,0,.25);}}
:root[data-theme="dark"]{--bg:#1A1714;--surface:#25211D;--surface-2:#201C19;--text:#EFE8DE;--text-muted:#A39A8E;--accent:#D9955B;--gold:#D9B061;--good:#78C28E;--border:#35302A;--rule:rgba(239,232,222,.08);--sh:0 1px 2px rgba(0,0,0,.2),0 6px 20px rgba(0,0,0,.25);}
body{font-size:15.5px;line-height:1.5;}
header{background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:none;}
header .logo{font-style:normal;font-size:22px;}
main{padding:26px 20px 110px;}
.greet{font-size:30px;letter-spacing:-.01em;}
.card,.kpi,.hero,.nodo,.mcard,.ex-card,details,.rlink,.fb-box,.reto{box-shadow:var(--sh);border:none;}
.folder-card,.ex-card,.fb-box,.reto,.consigna{border-left:none;border-radius:var(--radius);}
.pcard{border-left:none!important;border-radius:var(--radius)!important;}
.fb-box,.reto{background:var(--surface);}
.consigna{background:var(--surface-2);}
.btn,.cta-main,.opt,.field input[type=text],.field select{border-radius:12px;}
.btn.primary,.cta-main{background:var(--accent);box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 28%,transparent);}
.field input[type=text],.field select{border-color:var(--border);padding:12px 14px;}
#contenido{background-image:none;background-color:var(--surface);border:none;border-radius:var(--radius);box-shadow:var(--sh);padding:20px;}
:focus-visible{outline:2px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px;}
.field input:focus,.field select:focus,#contenido:focus,.mbox input:focus{outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent);}
.chip,.tag,.badge{border-radius:999px;}
.chip{border-color:transparent;background:var(--surface);box-shadow:var(--sh);}
.chip.active{background:var(--accent);color:var(--accent-ink);}
.prog{height:8px;border-radius:99px;}.prog i{border-radius:99px;}
nav{width:284px;border-radius:0 22px 22px 0;border-right:none;background:var(--surface);}
nav button{border-left:none;border-radius:12px;margin:2px 14px;width:calc(100% - 28px);padding:13px 14px;font-size:15px;}
nav button.active{background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--accent);border-left:none;}
.toast{border-radius:14px;}
@media(max-width:480px){header .tag{display:none;}}
.modal{position:fixed;inset:0;background:rgba(30,20,10,.45);display:grid;place-items:center;z-index:50;padding:20px;animation:fadein .15s;}
.mbox{background:var(--surface);border-radius:20px;padding:22px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.mbox h3{margin:0 0 6px;font-size:20px;}
.mbox input{width:100%;border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:15px;background:var(--surface-2);margin-top:8px;}
@keyframes fadein{from{opacity:0;}}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:18px;}
.tab{flex:none;border:none;background:transparent;color:var(--text-muted);padding:8px 16px;border-radius:999px;font-size:14px;}
.tab.on{background:var(--text);color:var(--bg);}
details{background:var(--surface);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;}
summary{cursor:pointer;font-weight:500;list-style:none;}
summary::-webkit-details-marker{display:none;}
details[open] summary{margin-bottom:8px;}
details ol,details ul{padding-left:20px;margin:0;line-height:1.7;font-size:14.5px;}
.gterm{padding:12px 0;border-bottom:1px solid var(--rule);}
.gterm b{font-family:var(--font-head);font-size:16px;}
.rlink{display:block;background:var(--surface);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;text-decoration:none;color:var(--text);}
.rlink b{display:block;font-size:15px;color:var(--accent);}
.rlink span{font-size:13px;color:var(--text-muted);}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
.tip.n .dot{background:var(--text-muted);}
.tip b{font-weight:600;}
.kpi{position:relative;}
.ico{position:absolute;top:12px;right:14px;color:var(--text-muted);font-size:15px;}
.areaL{fill:var(--accent);fill-opacity:.12;}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:drawl 1.2s ease forwards;}
@keyframes drawl{to{stroke-dashoffset:0;}}
.bar{transform-box:fill-box;transform-origin:bottom;animation:growb .8s ease-out;}
@keyframes growb{from{transform:scaleY(0);}}
.area{transform-box:fill-box;transform-origin:center;animation:popr .9s ease-out;}
@keyframes popr{from{transform:scale(.2);opacity:0;}}
.grid{stroke-dasharray:3 4;}
.gq{padding:11px 0;border-bottom:1px solid var(--rule);font-size:14.5px;}
.seg{display:flex;gap:6px;margin-top:8px;}
.seg button{flex:1;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:8px;font-size:13px;color:var(--text);}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}

<div id="app">
  <header><button id="menu-btn" aria-label="Menú">☰</button><span class="logo">Pluma maestra</span><span class="tag">asistente de escritura</span></header>
  <main><div id="view" class="view"></div></main>
  <div id="scrim"></div><nav aria-label="Menú principal"><div class="row">
    <button data-tab="inicio" class="active">Inicio</button>
    <button data-tab="aprender">Curso principal</button>
    <button data-tab="microcursos">Microcursos</button>

    <button data-tab="ajustes">Ajustes</button>
  </div></nav>
</div>

<script>
window.PM_STANDALONE=true;document.documentElement.classList.add('standalone');
(function(){
 const DBN='pluma-maestra',ST='docs';
 function idbStore(){let p=null;
  const open=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open(DBN,1);r.onupgradeneeded=()=>r.result.createObjectStore(ST);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));
  const run=(mode,fn)=>open().then(d=>new Promise((res,rej)=>{const t=d.transaction(ST,mode),s=t.objectStore(ST);let rq;try{rq=fn(s);}catch(e){rej(e);return;}t.oncomplete=()=>res(rq&&'result' in rq?rq.result:undefined);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);}));
  return {get:k=>run('readonly',s=>s.get(k)),put:(k,v)=>run('readwrite',s=>s.put(v,k)),del:k=>run('readwrite',s=>s.delete(k)),clear:()=>run('readwrite',s=>s.clear()),
   all:()=>open().then(d=>new Promise((res,rej)=>{const out={},t=d.transaction(ST,'readonly'),c=t.objectStore(ST).openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){out[cur.key]=cur.value;cur.continue();}};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);}))};}
 function makeDb(st){
  const clone=v=>JSON.parse(JSON.stringify(v)),idOf=p=>p.split('/').pop();
  const doc=path=>({id:idOf(path),
   set:async d=>{await st.put(path,clone(d));return {id:idOf(path)};},
   update:async d=>{const cur=(await st.get(path))||{};await st.put(path,Object.assign(cur,clone(d)));},
   get:async()=>{const v=await st.get(path);return {id:idOf(path),exists:v!==undefined,data:()=>v};},
   delete:async()=>{await st.del(path);}});
  const collection=path=>{const q={ord:null,dir:'asc',lim:null},api={
   orderBy:(f,d)=>{q.ord=f;q.dir=d||'asc';return api;},limit:n=>{q.lim=n;return api;},
   get:async()=>{const all=await st.all(),pre=path+'/';
    let docs=Object.keys(all).filter(k=>k.startsWith(pre)&&!k.slice(pre.length).includes('/')).map(k=>({id:k.slice(pre.length),data:()=>all[k]}));
    if(q.ord)docs.sort((a,b)=>{const x=a.data()[q.ord],y=b.data()[q.ord];return (x>y?1:x<y?-1:0)*(q.dir==='desc'?-1:1);});
    if(q.lim)docs=docs.slice(0,q.lim);return {docs};}};return api;};
  return {doc,collection};}
 window.__pmMakeDb=makeDb;
 if(typeof indexedDB==='undefined')return;
 const st=idbStore(),db=makeDb(st);
 window.claude={use:async n=>n==='db'?db:n==='user'?{id:async()=>'local'}:null};
 if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
 window.pmCard=()=>`<div class='card'><h3 class='serif'>Tus datos en este dispositivo</h3><p class='m' style='margin:0 0 12px'>Tu progreso, tus textos y tus ajustes se guardan solo en este dispositivo y funcionan sin conexión. Si borras los datos de la app o cambias de teléfono, se perderán, salvo que guardes una copia de seguridad.</p><button class='btn' id='pm-exp' style='width:100%;margin-bottom:10px'>Guardar copia de seguridad</button><button class='btn' id='pm-imp' style='width:100%;margin-bottom:10px'>Restaurar copia de seguridad</button><input type='file' id='pm-file' accept='application/json,.json' style='display:none'><button class='btn' id='pm-del' style='width:100%'>Borrar todos mis datos</button><p class='m' style='font-size:12px;margin:12px 0 0'>Pluma maestra · versión 1.0</p></div>`;
 window.pmWire=()=>{
  const $=id=>document.getElementById(id);
  $('pm-exp').onclick=async()=>{const datos=await st.all(),obj={app:'pluma-maestra',version:1,fecha:new Date().toISOString(),datos,ajustes:(()=>{try{return JSON.parse(localStorage.getItem('pm_ajustes')||'null');}catch(e){return null;}})()};
   const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(obj)],{type:'application/json'}));a.download='pluma-maestra-copia-'+obj.fecha.slice(0,10)+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);toast('Copia guardada');};
  $('pm-imp').onclick=()=>$('pm-file').click();
  $('pm-file').onchange=async e=>{const f=e.target.files[0];if(!f)return;let obj;try{obj=JSON.parse(await f.text());}catch(x){toast('El archivo no es válido');return;}
   if(!obj||obj.app!=='pluma-maestra'||typeof obj.datos!=='object'){toast('Ese archivo no es una copia de Pluma maestra');return;}
   const ok=await ask({t:'Restaurar copia',x:'Esto reemplaza todos los datos actuales por los de la copia ('+Object.keys(obj.datos).length+' registros).',ok:'Restaurar'});if(!ok)return;
   await st.clear();for(const k of Object.keys(obj.datos))await st.put(k,obj.datos[k]);
   try{if(obj.ajustes)localStorage.setItem('pm_ajustes',JSON.stringify(obj.ajustes));}catch(x){}
   toast('Copia restaurada');setTimeout(()=>location.reload(),600);};
  $('pm-del').onclick=async()=>{const ok=await ask({t:'Borrar todos mis datos',x:'Se eliminarán tu progreso, tus textos, tus proyectos y tus ajustes de este dispositivo. No se puede deshacer.',ok:'Borrar todo'});if(!ok)return;
   await st.clear();try{localStorage.removeItem('pm_ajustes');}catch(x){}location.reload();};};
 window.__pm={store:st};
})();

</script>
<script>
let db=null,userCap=null,userId=null,sampleFn=null;
let textos=[],carpetas=[],tab='inicio',proyScreen='carpetas',currentFolderId=null,activeId=null;

const PROMPTS=[
 {cat:'Narrativa',texto:'Un personaje vuelve a su casa de la infancia y encuentra algo que no debería estar ahí.'},
 {cat:'Narrativa',texto:'Escribe una escena en la que dos desconocidos quedan atrapados en el mismo lugar durante una tormenta.'},
 {cat:'Narrativa',texto:'Alguien encuentra una carta escrita por sí mismo, pero no recuerda haberla escrito.'},
 {cat:'Poesía',texto:'Escribe un poema breve sobre algo que se pierde lentamente, sin que nadie lo note.'},
 {cat:'Poesía',texto:'Describe tu ciudad como si fuera un cuerpo que respira.'},
 {cat:'Persuasivo',texto:'Convence a alguien de abandonar un hábito usando solo preguntas, sin dar ninguna orden.'},
 {cat:'Persuasivo',texto:'Escribe el argumento más honesto posible a favor de algo con lo que, en el fondo, no estás de acuerdo.'},
 {cat:'Diario',texto:'Describe los últimos cinco minutos tal como los viviste, sin interpretarlos.'},
 {cat:'Diario',texto:'Escribe sobre algo pequeño que cambió hoy, aunque nadie más lo haya notado.'},
 {cat:'Diálogo',texto:'Escribe una conversación entre dos personas que dicen lo contrario de lo que sienten.'},
 {cat:'Diálogo',texto:'Dos hermanos se reencuentran después de años. Uno quiere hablar del pasado; el otro, no.'},
 {cat:'Narrativa',texto:'Cuenta un mismo suceso desde el punto de vista de tres personajes distintos, en tres párrafos cortos.'}
];
const CATS=['Todas','Narrativa','Poesía','Persuasivo','Diario','Diálogo'];
const FOLDER_COLORS=['#A33440','#A6791C','#3C6E71','#6B5B95','#4C8C5B'];

function greeting(){const h=new Date().getHours();return h<12?'Buenos días. ¿Qué vas a escribir hoy?':h<20?'Buenas tardes. ¿Qué vas a escribir hoy?':'Buenas noches. ¿Qué vas a escribir hoy?';}
function palabras(s){s=(s||'').trim();return s?s.split(/\s+/).length:0;}
function fecha(ts){return new Date(ts).toLocaleDateString('es',{day:'numeric',month:'short'});}
function mdLite(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');}
function racha(lista){if(!lista.length)return 0;const days=new Set(lista.map(t=>new Date(t.fecha).toDateString()));let s=0,d=new Date();while(days.has(d.toDateString())){s++;d.setDate(d.getDate()-1);}return s;}
function toast(msg){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;document.body.appendChild(t);requestAnimationFrame(()=>t.classList.add('show'));setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300);},1800);}
function animarNumero(el,target){if(!el)return;const t0=performance.now(),dur=600;function step(t){const p=Math.min((t-t0)/dur,1);el.textContent=Math.round(p*target);if(p<1)requestAnimationFrame(step);}requestAnimationFrame(step);}

function analizarLocal(texto){
  const tips=[];
  const arr=(texto.match(/\p{L}+/gu)||[]);
  const total=arr.length||1;
  const mente=arr.filter(w=>/mente$/i.test(w)&&w.length>5).length;
  tips.push(mente/total*100>1.5?{ok:false,msg:`Hay ${mente} adverbios en "-mente". Probá reemplazar alguno por un verbo más preciso.`}:{ok:true,msg:'Buen control de los adverbios en "-mente".'});
  const oraciones=texto.split(/[.!?]+/).map(s=>s.trim()).filter(Boolean);
  const largas=oraciones.filter(o=>o.split(/\s+/).length>32).length;
  tips.push(largas>0?{ok:false,msg:`${largas} oración(es) superan las 32 palabras. Partirlas aligera el ritmo.`}:{ok:true,msg:'La extensión de las oraciones está bien equilibrada.'});
  const stop=new Set(['que','los','las','una','para','pero','como','esta','este','esto','con','por','sus','sobre','donde','desde','entre','cuando','aunque','muy','era','fue','son','han','hay']);
  const freq={};arr.forEach(w=>{const l=w.toLowerCase();if(l.length>4&&!stop.has(l))freq[l]=(freq[l]||0)+1;});
  const top=Object.entries(freq).sort((a,b)=>b[1]-a[1])[0];
  tips.push(top&&top[1]>=4?{ok:false,msg:`La palabra "${top[0]}" aparece ${top[1]} veces. Capaz conviene variarla o usar un pronombre.`}:{ok:true,msg:'No hay palabras que se repitan en exceso.'});
  const cliches=['de repente','sus ojos reflejaban','el silencio se hizo','como un rayo','su corazón latía con fuerza','en ese preciso instante','un escalofrío recorrió'];
  const enc=cliches.find(c=>texto.toLowerCase().includes(c));
  tips.push(enc?{ok:false,msg:`La frase "${enc}" es un lugar común muy usado. Probá una imagen más propia.`}:{ok:true,msg:'No se detectaron frases hechas comunes.'});
  const tell=(texto.match(/\b(estaba|se sintió|sintió|era) (feliz|triste|enojad[oa]|nervios[oa]|asustad[oa])\b/gi)||[]).length;
  tips.push(tell>0?{ok:false,msg:'Hay emociones nombradas directamente (ej. "estaba triste"). Probá mostrarlas con una acción o un gesto.'}:{ok:true,msg:'Las emociones se muestran bien, sin nombrarlas de más.'});
  const parrafos=texto.split(/\n+/).map(p=>p.trim()).filter(Boolean);
  if(parrafos.length>=3){
    const longs=parrafos.map(p=>p.split(/\s+/).length);
    const prom=longs.reduce((a,b)=>a+b,0)/longs.length;
    const variacion=longs.some(l=>Math.abs(l-prom)>prom*0.6);
    tips.push(!variacion?{ok:false,msg:'Los párrafos tienen una longitud muy pareja. Alternar cortos y largos ayuda al ritmo.'}:{ok:true,msg:'Buena variación en la longitud de los párrafos.'});
  }
  return tips;
}

async function init(){
  try{
    if(window.claude&&window.claude.use){
      db=await claude.use('db');userCap=await claude.use('user');sampleFn=await claude.use('sample');
      if(userCap)userId=await userCap.id();
    }
  }catch(e){}
  await Promise.all([loadTextos(),loadCarpetas(),loadProg(),loadPerfil()]);
  switchTab('inicio');
}
async function loadTextos(){
  if(!db||!userId){textos=[];return;}
  try{const snap=await db.collection('data/users/'+userId+'/textos').orderBy('fecha','desc').limit(80).get();textos=snap.docs.map(d=>({id:d.id,...d.data()}));}catch(e){textos=[];}
}
async function loadCarpetas(){
  if(!db||!userId){carpetas=[];return;}
  try{const snap=await db.collection('data/users/'+userId+'/carpetas').orderBy('fecha','desc').limit(50).get();carpetas=snap.docs.map(d=>({id:d.id,...d.data()}));}catch(e){carpetas=[];}
}
async function guardarTexto(obj){
  const id=obj.id||('t'+Date.now());
  const data={titulo:obj.titulo||'Sin título',genero:obj.genero,contenido:obj.contenido,feedback:obj.feedback||null,carpetaId:obj.carpetaId||null,reto:obj.reto||null,skills:obj.skills||null,fuente:obj.fuente||null,mod:Date.now(),fecha:obj.fecha||Date.now(),palabras:palabras(obj.contenido)};
  const idx=textos.findIndex(t=>t.id===id);
  if(idx>-1)textos[idx]={id,...data};else textos.unshift({id,...data});
  if(db&&userId){try{await db.doc('data/users/'+userId+'/textos/'+id).set(data);}catch(e){}}
  retoActivo=null;return id;
}
async function crearCarpeta(){
  const nombre=prompt('Nombre de la nueva carpeta:');
  if(!nombre||!nombre.trim())return;
  const c={id:'c'+Date.now(),nombre:nombre.trim(),color:FOLDER_COLORS[carpetas.length%FOLDER_COLORS.length],fecha:Date.now()};
  carpetas.unshift(c);
  if(db&&userId){try{await db.doc('data/users/'+userId+'/carpetas/'+c.id).set(c);}catch(e){}}
  toast('Carpeta creada');renderProyectos();
}

function switchTab(t){
  tab=t;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));

  document.getElementById('back-btn').onclick=()=>{proyScreen='carpeta';renderProyectos();};
  document.getElementById('guardar-btn').onclick=async()=>{
    const id=await guardarTexto({id:activeId,titulo:document.getElementById('titulo').value,genero:document.getElementById('genero').value,contenido:ta.value,feedback:t.feedback,skills:t.skills,fuente:t.fuente,reto:t.reto||retoActivo,carpetaId:document.getElementById('proy').value||null,fecha:t.fecha});
    activeId=id;currentFolderId=document.getElementById('proy').value||null;toast('Guardado');renderEditorView();
  };
  document.getElementById('gui-btn').onclick=()=>abrirGuia(t,ta);wireReto(t,ta);document.getElementById('local-btn').onclick=()=>{
    const tips=analizarLocal(ta.value||'',document.getElementById('genero').value);guardarLocal(tips,t,ta);
    document.getElementById('local-area').innerHTML=`<div class="fb-box"><h4>Análisis local · gratis y sin salir de tu dispositivo</h4>${tips.map(x=>`<div class="tip ${x.ok?'ok':x.ok===null?'n':''}"><span class="dot"></span><span>${x.msg}</span></div>`).join('')}</div>`;
  };
  document.getElementById('fb-btn').onclick=async()=>{
    if(palabras(ta.value)<25){document.getElementById('fb-area').innerHTML='<div class="notice">Escribe al menos 25 palabras para pedir feedback con IA.</div>';return;}
    if(!sampleFn){document.getElementById('fb-area').innerHTML='<div class="notice">El feedback con IA no está disponible en esta vista. Abrí la app publicada en claude.ai para usarlo.</div>';return;}
    const btn=document.getElementById('fb-btn');btn.disabled=true;btn.textContent='Pensando...';btn.classList.add('pulsing');
    try{
      const prompt=`Sos un editor profesional y mentor de escritura, cálido pero honesto. Analizá este texto en español (género: ${document.getElementById('genero').value}) y da feedback breve y específico en este formato:\n\n**Fortalezas:** 2-3 puntos concretos.\n**A mejorar:** 2-3 puntos concretos.\n**Sugerencia:** un consejo práctico para la próxima revisión.\n\nNo repitas ni cites el texto completo. Texto:\n"""${ta.value}"""`;
      const res=await analizarIA(ta.value,document.getElementById('titulo').value,document.getElementById('genero').value);
      const id=await guardarTexto({id:activeId,titulo:document.getElementById('titulo').value,genero:document.getElementById('genero').value,contenido:ta.value,feedback:res.text,skills:res.skills,fuente:'ia',reto:t.reto||retoActivo,carpetaId:document.getElementById('proy').value||null,fecha:t.fecha});
      activeId=id;renderEditorView();
    }catch(e){
      const msg=e&&e.code==='rate_limited'?'Hay mucha demanda ahora mismo. Prueba de nuevo en un momento.':'No se pudo generar el feedback. Probá de nuevo.';
      document.getElementById('fb-area').innerHTML=`<div class="notice">${msg}</div>`;
      btn.disabled=false;btn.textContent='Feedback con IA';btn.classList.remove('pulsing');
    }
  };
}

const LECC=[
L('l1',0,12,'¿Qué es escribir? El núcleo del oficio','Las ideas fundacionales del oficio: elección, claridad y emoción como destino de toda escritura.',['estructura narrativa','estilo y voz'],`<p>Escribir no es transcribir lo que ya pensaste: es <b>pensar a través de las palabras</b>. Cada frase es una decisión, y el oficio consiste en tomar esas decisiones con intención.</p><h3>Tres ideas fundacionales</h3><ol><li><b>La escritura es elección.</b> Decides qué contar y, sobre todo, qué callar. Lo que omites define tanto la obra como lo que muestras.</li><li><b>La claridad antes que el adorno.</b> Una idea clara en lenguaje sencillo vale más que tres ideas difusas envueltas en adjetivos.</li><li><b>La emoción es el destino.</b> El lector no recuerda tramas: recuerda lo que sintió al leerlas.</li></ol><h3>La silla y la página</h3><p>El primer hábito del escritor no es la inspiración, sino la constancia. Reserva un tiempo, siéntate y escribe aunque no sepas qué decir. La página en blanco se vence escribiéndola.</p><blockquote>Escribir es fácil: solo hay que sentarse a trabajar.</blockquote><p>En las próximas lecciones aprenderás las herramientas para que esa práctica se convierta en literatura.</p>`,{t:'Diario de intención',d:'f',s:'Escribe por qué quieres escribir y qué quieres lograr con tus textos.',c:'En 150 palabras, responde: ¿qué te empuja a escribir? ¿qué quieres que sienta tu lector?',min:100},[{q:'¿Qué significa que «la escritura es elección»?',o:['Decidir qué contar y qué callar','Escribir lo primero que se te ocurra','Elegir un tema popular'],a:0,w:'Lo que omites define la obra tanto como lo que muestras.'},{q:'¿Cuál es el primer hábito del escritor según la lección?',o:['Esperar la inspiración','La constancia','Leer solo clásicos'],a:1,w:'La página en blanco se vence escribiéndola.'}]),
L('l2',0,14,'La frase y el párrafo','Cómo construir frases con ritmo y párrafos con respiración: la unidad mínima de la prosa.',['estilo y voz','gramatica y ortografia','descripcion y ambientacion'],`<p>La frase es la unidad mínima de la prosa; el párrafo, su respiración. Dominarlos es dominar el ritmo.</p><h3>La frase</h3><p>Una frase corta golpea; una larga envuelve. Alterna según lo que quieras que sienta el lector, y procura que cada frase lleve una sola idea principal.</p><h3>El párrafo</h3><p>Un párrafo organiza una idea o un momento. Cuando cambia el tema, el tiempo o el lugar, empieza otro. Los muy largos cansan; los muy cortos, repetidos, fragmentan.</p><h3>Tres revisiones</h3><ol><li>Lee en voz alta: donde te quedes sin aire, corta.</li><li>Elimina las palabras que no cambian el sentido.</li><li>Cuida la puntuación: es el ritmo escrito.</li></ol><blockquote>La puntuación es la respiración del texto.</blockquote>`,{t:'Reescritura con ritmo',d:'f',s:'Toma un párrafo tuyo y reescríbelo variando la longitud de las frases.',c:'Escribe un párrafo de 80 palabras con al menos una frase muy corta y una muy larga.',min:80},[{q:'¿Qué efecto tiene una frase corta entre frases largas?',o:['Da énfasis y rompe el ritmo','Confunde al lector','No tiene efecto'],a:0,w:'El contraste marca lo importante.'},{q:'¿Cuándo conviene empezar un nuevo párrafo?',o:['Cuando cambia el tema, el tiempo o el lugar','Cada tres líneas','Nunca'],a:0,w:'El párrafo organiza una idea o un momento.'}]),
L('l3',0,15,'Mostrar, no contar','El principio más poderoso de la ficción: convertir resúmenes en escenas vivas y sensoriales.',['descripcion de emociones','descripcion y ambientacion','estilo y voz'],`<p>Contar resume; mostrar escenifica. Cuando muestras, el lector deduce y siente por sí mismo.</p><h3>La diferencia</h3><p><i>Contar:</i> «Estaba nervioso». <i>Mostrar:</i> se secó las manos en el pantalón por tercera vez.</p><h3>Cómo mostrar</h3><ol><li>Usa acciones y gestos concretos.</li><li>Apela a los cinco sentidos.</li><li>Deja que el diálogo y los objetos revelen.</li></ol><h3>Cuándo contar</h3><p>Contar sirve para pasar rápido por lo poco importante. Muestra los momentos clave; cuenta las transiciones.</p><blockquote>No digas que el hielo era frío: haz que el lector sienta cómo le duelen los dedos.</blockquote>`,{t:'Del resumen a la escena',d:'m',s:'Convierte una frase que cuenta en una escena que muestra.',c:'Toma «Estaba furioso» y escríbelo como una escena de 120 palabras sin nombrar la emoción.',min:100},MODS[0].qs),
L('l4',1,18,'Estructura narrativa y arco','Los huesos del relato: principio, desarrollo y desenlace, y cómo construir un arco con tensión creciente.',['estructura narrativa','tension y conflicto'],`<p>Toda historia es un cambio. La estructura es el camino ordenado de ese cambio.</p><h3>Las tres partes</h3><ol><li><b>Principio:</b> presenta al personaje, su mundo y lo que quiere.</li><li><b>Desarrollo:</b> obstáculos crecientes que ponen a prueba su deseo.</li><li><b>Desenlace:</b> la crisis se resuelve y algo cambia para siempre.</li></ol><h3>Tensión creciente</h3><p>Cada escena debe elevar lo que está en juego. Si una escena no cambia nada, probablemente sobra.</p><blockquote>Una escena sin cambio es solo decoración.</blockquote>`,{t:'Esqueleto de un relato',d:'m',s:'Esboza las tres partes de una historia breve.',c:'En 150 palabras describe principio, desarrollo y desenlace de un relato, con un deseo y un obstáculo claros.',min:120},[{q:'¿Qué función cumple el desarrollo?',o:['Poner obstáculos crecientes al deseo del personaje','Resumir la historia','Presentar el mundo'],a:0,w:'Los obstáculos ponen a prueba lo que el personaje quiere.'},{q:'Si una escena no cambia nada en la historia...',o:['Probablemente sobra','Debe alargarse','Es el clímax'],a:0,w:'Cada escena debe mover algo.'}]),
L('l5',1,18,'Personajes: deseo, conflicto, cambio','Los personajes viven cuando quieren algo, encuentran obstáculos y se transforman.',['personajes','tension y conflicto'],`<p>Los personajes viven cuando quieren algo, encuentran obstáculos y se transforman.</p><h3>Deseo y necesidad</h3><p>Lo que el personaje <b>quiere</b> mueve la trama; lo que <b>necesita</b> la vuelve profunda. La distancia entre ambos es su drama.</p><h3>Conflicto</h3><p>Un obstáculo revela quién es el personaje. Bajo presión, elige, y esa elección lo define.</p><h3>Cambio</h3><p>Al final, el personaje no debe ser igual que al comienzo, aunque el cambio sea sutil.</p><blockquote>Somos lo que elegimos cuando elegir cuesta.</blockquote>`,{t:'Ficha de personaje',d:'m',s:'Define a un personaje desde su deseo.',c:'Describe en 150 palabras a un personaje: qué quiere, qué necesita y qué se lo impide.',min:120},MODS[4].qs),
L('l6',1,16,'Construcción de diálogos','Diálogos que suenan naturales, revelan carácter y avanzan la trama sin explicarlo todo.',['dialogos','personajes'],`<p>Un buen diálogo suena natural, pero es más económico que la conversación real.</p><h3>Tres funciones</h3><ol><li><b>Revelar carácter:</b> cada personaje habla distinto.</li><li><b>Avanzar la trama</b> sin explicarla.</li><li><b>Crear tensión</b> con lo no dicho.</li></ol><h3>Consejos</h3><p>Recorta saludos y muletillas. Usa «dijo» como etiqueta discreta. Deja que los personajes se interrumpan, esquiven y callen.</p><blockquote>Lo importante casi nunca se dice de frente.</blockquote>`,{t:'Conversación con subtexto',d:'m',s:'Escribe un diálogo donde lo importante no se dice.',c:'Escribe un diálogo de 150 palabras donde dos personas hablan de algo trivial mientras discuten otra cosa.',min:120},MODS[2].qs),
L('l7',1,17,'Descripción de emociones','Cómo transmitir sentimientos sin nombrarlos, usando el cuerpo, los objetos y el entorno.',['descripcion de emociones','estilo y voz'],`<p>Nombrar una emoción la apaga; sugerirla la enciende.</p><h3>Tres vías</h3><ol><li><b>El cuerpo:</b> pulso, manos, respiración, postura.</li><li><b>Los objetos:</b> lo que el personaje toca, rompe o evita.</li><li><b>El entorno:</b> cómo el mundo parece reflejar el ánimo.</li></ol><h3>Evita el cliché</h3><p>«Un escalofrío le recorrió la espalda» ya no dice nada. Busca el detalle que solo este personaje, en esta escena, tendría.</p><blockquote>La emoción más fuerte es la que el personaje intenta esconder.</blockquote>`,{t:'Emoción sin nombre',d:'d',s:'Transmite una emoción sin nombrarla.',c:'Describe en 150 palabras el miedo de un personaje sin usar la palabra «miedo» ni sinónimos directos.',min:120},[{q:'¿Cuál evita nombrar la emoción?',o:['Sentía tristeza','Dejó el café enfriarse sin tocarlo','Estaba muy triste'],a:1,w:'La acción sugiere sin etiquetar.'},{q:'Un buen detalle emocional es...',o:['Un cliché reconocible','El que solo este personaje tendría en esta escena','Una lista de adjetivos'],a:1,w:'Lo específico es lo que convence.'}]),
L('l8',2,20,'Worldbuilding: construir mundos creíbles','Mundos que se sostienen: coherencia, detalles significativos y la regla del iceberg.',['worldbuilding','descripcion y ambientacion'],`<p>Un mundo convincente no es uno exhaustivo, sino uno <b>coherente</b>. El lector debe sentir que hay un detrás, aunque no lo vea todo.</p><h3>La regla del iceberg</h3><p>Construye diez veces más mundo del que muestras. El lector percibe la profundidad que no se explica: las costumbres que se asumen, los conflictos que se intuyen.</p><h3>Los cuatro pilares</h3><ol><li><b>Reglas:</b> ¿cómo funciona este mundo? Magia, ciencia, sociedad. Define límites y costos.</li><li><b>Geografía e historia:</b> de dónde viene el conflicto, qué marcas dejó el pasado.</li><li><b>Cultura y poder:</b> quién manda, quién sufre, qué se valora.</li><li><b>Cotidiano:</b> qué comen, cómo hablan, qué temen. Lo pequeño ancla lo grande.</li></ol><h3>Detalles significativos</h3><p>No describas el mundo: filtra lo que el personaje nota. Un soldado ve armas; un cocinero, olores. El punto de vista decide el mundo que se muestra.</p><h3>Evitar la infodump</h3><p>No detengas la historia para explicar el mundo. Reparte la información cuando el lector la necesita, intégrala en la acción y en el diálogo.</p><blockquote>El mundo existe para servir a la historia, no al revés.</blockquote>`,{t:'Reglas del mundo',d:'d',s:'Define las reglas internas de un mundo ficticio.',c:'Establece 3 reglas de tu mundo (cómo funciona algo) y un costo por romperlas. 200 palabras.',min:200},[{q:'¿Qué propone la regla del iceberg?',o:['Construir mucho más mundo del que muestras','Mostrar todo lo que inventaste','Que el mundo no importa'],a:0,w:'La profundidad se percibe aunque no se explique.'},{q:'¿Qué es una infodump?',o:['Detener la historia para explicar el mundo','Un detalle sensorial','Un tipo de diálogo'],a:0,w:'Reparte la información cuando el lector la necesita.'}]),
L('l9',2,18,'Tensión, ritmo y pacing','Cómo dosificar la información y variar el tiempo para mantener al lector atrapado.',['ritmo y pacing','tension y conflicto'],`<p>El ritmo es la velocidad a la que el lector recibe la información. Dosificarla mantiene la atención.</p><h3>Acelerar y frenar</h3><p>Para acelerar: frases cortas, verbos de acción, poca descripción. Para frenar: frases largas, detalle sensorial, reflexión.</p><h3>Dosificar</h3><p>Revela lo justo. Una pregunta abierta empuja a seguir leyendo; resolverla demasiado pronto apaga la tensión.</p><h3>Variar el tiempo</h3><p>Resume lo irrelevante y dilata lo decisivo: un segundo clave puede ocupar una página.</p><blockquote>El suspenso vive en lo que aún no se sabe.</blockquote>`,{t:'Dilatar un instante',d:'d',s:'Estira un segundo de tensión.',c:'Escribe 150 palabras que dilaten un solo segundo de tensión (una puerta que se abre, un resultado por leer).',min:120},MODS[3].qs),
L('l10',2,16,'Voz autoral y estilo','Cómo encontrar una voz propia y un estilo reconocible sin imitar ni forzar la originalidad.',['estilo y voz','descripcion y ambientacion'],`<p>La voz es la manera personal de mirar y de decir. No se inventa: se descubre escribiendo mucho.</p><h3>Cómo encontrarla</h3><ol><li>Lee con atención a quienes admiras y nota qué hacen.</li><li>Escribe sin filtro y revisa después.</li><li>Identifica tus obsesiones: temas, imágenes y ritmos que se repiten.</li></ol><h3>Sin imitar ni forzar</h3><p>Imitar enseña, pero la voz propia aparece cuando dejas de intentar sonar a alguien.</p><blockquote>El estilo es lo que queda cuando dejas de intentar tenerlo.</blockquote>`,{t:'Una página, tu voz',d:'d',s:'Mira tu entorno a tu manera.',c:'Describe tu calle como si fuera el escenario de una historia, en 200 palabras, buscando tu manera de mirar.',min:150},MODS[1].qs)];

 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.k,bien=k===q.a;if(bien)quiz.ok++;
  document.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.k===q.a)x.classList.add('bien');});if(!bien)b.classList.add('mal');
  document.getElementById('res').innerHTML=`<div class="fb-box"><b>${bien?'¡Correcto!':'Casi.'}</b> ${q.w||''}</div><button class="cta-main" id="sig" style="margin-top:16px">Continuar</button>`;
  document.getElementById('sig').onclick=()=>{quiz.j++;quiz.j<quiz.qs.length?renderPregunta():finQuiz();};});}
async function finQuiz(){const n=NODOS[quiz.i],pct=Math.round(quiz.ok/quiz.qs.length*100),min=quiz.skip?80:50,pasa=pct>=min,prev=prog[n.id];
 if(pasa&&(!prev||prev.score==null||pct>prev.score)){prog[n.id]={score:pct,fecha:Date.now(),adelantado:!!quiz.skip};if(db&&userId){try{await db.doc('data/users/'+userId+'/progreso/'+n.id).set(prog[n.id]);}catch(e){}}}
 document.getElementById('view').innerHTML=`<h1 class="greet serif">${pasa?'¡Módulo superado!':'Todavía no'}</h1><div class="medal">${pasa?medalla(pct):'↻'}</div><p class="serif" style="font-size:20px;text-align:center">${pct}% de aciertos</p><p class="m" style="text-align:center">${pasa?'Guardamos tu mejor puntaje.':'Necesitás '+min+'% para avanzar. Repasá y volvé a intentarlo.'}</p><button class="cta-main" id="rt" style="margin-top:20px">Reintentar</button><button class="btn" id="vc" style="width:100%">Volver al camino</button>`;
 document.getElementById('rt').onclick=()=>iniciarQuiz(quiz.i,quiz.skip);document.getElementById('vc').onclick=renderAprender;}
const RECURSOS=[{t:'Mostrar vs. contar',q:'mostrar no contar escritura creativa'},{t:'Estructura narrativa',q:'estructura narrativa planteamiento nudo desenlace'},{t:'Escribir diálogos',q:'cómo escribir diálogos narrativa'},{t:'Construcción de personajes',q:'crear personajes narrativa'},{t:'Poesía y métrica',q:'métrica poesía española'},{t:'Edición y corrección',q:'cómo editar un texto narrativo'}];

const SKILLS=[['estructura narrativa','Estructura narrativa'],['personajes','Construcción de personajes'],['dialogos','Diálogos'],['descripcion de emociones','Descripción de emociones'],['worldbuilding','Worldbuilding'],['ritmo y pacing','Ritmo y pacing'],['estilo y voz','Estilo y voz autoral'],['descripcion y ambientacion','Descripción y ambientación'],['tension y conflicto','Tensión y conflicto'],['gramatica y ortografia','Gramática y ortografía']];
async function analizarIA(texto,titulo,genero){
 const p=`Eres un editor literario profesional, exigente y cálido, que acompaña a escritores en formación. Analiza el siguiente escrito con rigor técnico y sensibilidad literaria.\n\nTítulo: ${titulo||'Sin título'}\nGénero: ${genero||'no especificado'}\n\nESCRITO:\n"""\n${texto}\n"""\n\nPuntua de 0 a 100 (100 = dominio profesional) estas diez dimensiones: ${SKILLS.map(s=>s[0]).join(', ')}.\n\nResponde ÚNICAMENTE con un objeto JSON válido, sin texto extra, con estas claves: summary (1-2 frases sobre el nivel general), overall_feedback (feedback desarrollado en varios párrafos, con observaciones concretas tomadas del texto), strengths (array de frases cortas y específicas), areas_to_improve (array de frases cortas y accionables), skill_scores (objeto con exactamente las diez claves en español de arriba y números de 0 a 100), suggested_skills (array con las claves de las 1 a 3 habilidades más débiles). Sé honesto y específico; evita halagos vacíos. Responde en español.`;
 const raw=(await sampleFn(p,{modelTier:'default'})).text;
 try{
  const j=JSON.parse(raw.replace(/```json|```/g,'').trim());
  const L=a=>(a||[]).map(x=>'• '+x).join('\n');
  const sug=(j.suggested_skills||[]).map(k=>(SKILLS.find(s=>s[0]===k)||[0,k])[1]).join(', ');
  return {text:`**${j.summary}**\n\n${j.overall_feedback}\n\n**Fortalezas**\n${L(j.strengths)}\n\n**A mejorar**\n${L(j.areas_to_improve)}`+(sug?`\n\n**Para reforzar:** ${sug}`:''),skills:j.skill_scores||null};
 }catch(e){return {text:raw,skills:null};}
}
function renderProgreso(){

 const serie=an.map(avgOf);
 const prom=an.length?Math.round(serie.reduce((a,b)=>a+b,0)/serie.length):null;
 const sk=SKILLS.map(([k,l])=>{const v=an.map(t=>t.skills[k]).filter(x=>typeof x==='number');return {l,v:v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):0};});
 const best=an.length?sk.slice().sort((a,b)=>b.v-a.v)[0].l:'—';
 const evo=serie.length>1?Math.round(serie[serie.length-1]-serie[0]):0;
 const done=NODOS.filter(n=>prog[n.id]).length;
 let line='',radar='',bars='';

  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/10;return [(150+Math.cos(a)*r).toFixed(1),(115+Math.sin(a)*r).toFixed(1)].join(',');};
  radar=`<svg class="chart" viewBox="0 0 300 230">${[.25,.5,.75,1].map(f=>`<polygon class="grid" points="${sk.map((_,i)=>pt(i,f*90)).join(' ')}"/>`).join('')}<polygon class="area" points="${sk.map((s,i)=>pt(i,s.v/100*90)).join(' ')}"/>${sk.map((_,i)=>{const q=pt(i,102).split(',');return `<text x="${q[0]}" y="${q[1]}" font-size="9" text-anchor="middle" dominant-baseline="middle" fill="currentColor" opacity=".7">${i+1}</text>`;}).join('')}</svg>`;
  const meses={};an.forEach(t=>{const m=new Date(t.fecha).toLocaleDateString('es',{month:'short',year:'2-digit'});meses[m]=(meses[m]||0)+1;});
  const ks=Object.keys(meses),mx=Math.max(...Object.values(meses));
  bars=`<svg class="chart" viewBox="0 0 300 130">${ks.map((m,i)=>{const w=Math.min(60,260/ks.length-12),x=20+i*(260/ks.length)+(260/ks.length-w)/2,h=meses[m]/mx*85;return `<rect class="bar" x="${x}" y="${100-h}" width="${w}" height="${h}" rx="3"/><text x="${x+w/2}" y="118" font-size="10" text-anchor="middle" fill="currentColor" opacity=".7">${m}</text><text x="${x+w/2}" y="${94-h}" font-size="10" text-anchor="middle" fill="currentColor">${meses[m]}</text>`;}).join('')}</svg>`;
 }
 document.getElementById('view').innerHTML=`<h1 class="greet serif">Tu evolución como escritor</h1>
 <div class="kpis"><div class="kpi"><span class="m">Escritos analizados</span><b>${an.length}</b></div><div class="kpi"><span class="m">Promedio general</span><b>${prom===null?'—':prom+'/100'}</b></div><div class="kpi"><span class="m">Habilidad más fuerte</span><b style="font-size:16px">${best}</b></div><div class="kpi"><span class="m">Evolución</span><b>${evo>0?'+':''}${evo} pts</b></div></div>
 ${an.length?`<div class="card"><h3 class="serif">Puntuación media por análisis</h3>${line}</div><div class="card"><h3 class="serif">Perfil de habilidades</h3>${radar}${sk.map((s,i)=>`<div class="sk"><span>${i+1}. ${s.l}</span><span>${s.v}</span></div><div class="prog"><i style="width:${s.v}%"></i></div>`).join('')}</div><div class="card"><h3 class="serif">Escritos analizados por mes</h3>${bars}</div>`:'<div class="notice">Todavía no hay datos. Abrí un texto en Proyectos y tocá "Feedback con IA": cada análisis puntúa tus 10 habilidades y alimenta estos gráficos.</div>'}
 <div class="card"><h3 class="serif">Curso principal</h3><div class="prog"><i style="width:${done/NODOS.length*100}%"></i></div><span class="m">${done} de ${NODOS.length} completados</span></div>`;
}

 if(!libre(i)){ask({t:'Lección bloqueada',x:'Puedes adelantarla rindiendo un examen: necesitas 80% o más para superarla.',ok:'Rendir examen'}).then(r=>{if(r)iniciarQuiz(i,true);});return;}

MI('m1',10,'Subtexto en el diálogo','Cómo hacer que lo no dicho pese más que lo dicho.',['dialogos','tension y conflicto'],`<p>El subtexto es lo que los personajes sienten o quieren pero no dicen. Cuando lo no dicho pesa más que lo dicho, el diálogo deja de informar y empieza a tensar.</p><h3>Cómo se construye</h3><ol><li><b>Dale a cada personaje un objetivo oculto</b> en la escena: quiere algo que no puede pedir de frente.</li><li><b>Haz que hablen de otra cosa:</b> discuten por los platos cuando en realidad discuten por el abandono.</li><li><b>Usa la evasión:</b> una respuesta que esquiva la pregunta dice más que una confesión.</li></ol><h3>Señales de subtexto</h3><p>Pausas, cambios de tema, preguntas contestadas con preguntas, gestos que contradicen las palabras. Un «estoy bien» dicho mientras se rompe una taza cuenta la verdad entera.</p><h3>Error común</h3><p>Los personajes que explican lo que sienten («Me duele que me ignores») suenan a informe. Déjalo en lo no dicho y confía en el lector.</p><blockquote>El diálogo es la punta; el subtexto, el iceberg.</blockquote>`,{t:'Dos niveles',d:'m',s:'Escribe una conversación con dos conversaciones a la vez.',c:'Escribe 150 palabras de diálogo donde dos personajes hablan de la cena mientras discuten sobre algo que ninguno nombra.'}),
MI('m2',9,'La regla del iceberg en worldbuilding','Construir profundidad sin abrumar al lector.',['worldbuilding'],`<p>La regla del iceberg dice que solo una pequeña parte del mundo debe verse; el resto sostiene la historia desde abajo, sin aparecer en la página.</p><h3>Qué construir en la sombra</h3><ol><li><b>Historia:</b> qué pasó antes y qué heridas dejó.</li><li><b>Costumbres:</b> reglas no escritas que los personajes obedecen sin pensar.</li><li><b>Economía y poder:</b> de qué vive la gente y quién decide.</li></ol><h3>Cómo se filtra a la página</h3><p>Con una referencia al pasar, un objeto que carga historia, una reacción que revela una norma. El lector completa el resto y lo siente más real que si se lo explicaran.</p><h3>Cuánto mostrar</h3><p>Muestra lo que cambia la decisión del personaje en esa escena. Si un dato no afecta lo que ocurre, guárdalo en la sombra.</p><blockquote>Lo que no se explica da profundidad; lo que se explica de más, peso muerto.</blockquote>`,{t:'La punta del iceberg',d:'m',s:'Sugiere un mundo con tres detalles.',c:'Describe una escena cotidiana en 150 palabras que insinúe tres reglas de tu mundo sin explicarlas.'}),
MI('m3',11,'Técnicas de apertura: engancha en la primera página','Principios que capturan al lector desde la primera línea.',['estructura narrativa','ritmo y pacing'],`<p>La primera línea es una promesa: le dice al lector qué clase de historia va a vivir y por qué debería seguir. No necesita ser espectacular, sí específica.</p><h3>Tres tipos de apertura</h3><ol><li><b>Incógnita:</b> una situación que exige explicación («El día que mi madre empezó a hablar en pasado…»).</li><li><b>Voz:</b> un tono tan distintivo que invita a leer solo por escuchar a quien narra.</li><li><b>Acción:</b> empezar en medio del conflicto, con el personaje ya en movimiento.</li></ol><h3>Qué evitar</h3><p>Preámbulos, descripciones estáticas de arranque, el despertador, el clima por sí solo y los resúmenes de lo que va a pasar. El lector decide en pocos párrafos si se queda.</p><h3>Cómo probarla</h3><p>Escribe diez primeras líneas para la misma historia y quédate con la que abre más preguntas. Luego verifica que la historia las responda.</p><blockquote>Una buena apertura promete; el resto de la historia paga.</blockquote>`,{t:'Primera línea',d:'m',s:'Escribe tres aperturas distintas para un mismo cuento.',c:'Tres primeras líneas de estilos diferentes para la misma historia. Compara cuál engancha más.'}),
MI('m4',12,'El punto de vista: elegir la lente narrativa','Primera, segunda, tercera limitada u omnisciente: cada lente cambia todo.',['estilo y voz','estructura narrativa'],`<p>El punto de vista es la lente: decide quién cuenta, cuánto sabe y qué puede mostrar. Cambiarlo cambia la historia entera.</p><h3>Las cuatro lentes</h3><ol><li><b>Primera persona:</b> íntima y subjetiva; el lector solo sabe lo que el narrador vive, piensa o cree.</li><li><b>Segunda persona:</b> rara y arriesgada; interpela al lector y crea un efecto casi hipnótico.</li><li><b>Tercera limitada:</b> acompaña a un personaje y accede solo a su mente.</li><li><b>Omnisciente:</b> sabe todo de todos; permite escala, pero distancia.</li></ol><h3>Cómo elegir</h3><p>Pregunta qué necesita saber el lector y qué debe ignorar. Un narrador que miente o ignora genera tensión; uno que lo sabe todo genera panorama.</p><h3>Coherencia</h3><p>Una vez elegida la lente, manténla. Saltar a la mente de otro personaje sin aviso confunde y rompe la inmersión.</p><blockquote>Cambia al narrador y habrás cambiado la historia.</blockquote>`,{t:'La misma escena, otra lente',d:'d',s:'Cuenta un hecho desde dos puntos de vista.',c:'Narra una discusión en 80 palabras en primera persona y luego en tercera limitada desde el otro personaje.'}),
MI('m5',10,'Mostrar emociones sin nombrarlas','Profundiza el principio «mostrar, no contar» aplicado al mundo emocional.',['descripcion de emociones'],`<p>Nombrar una emoción la resume; mostrarla permite que el lector la viva. El truco está en elegir la señal precisa y confiar en que se entienda.</p><h3>Cuatro canales</h3><ol><li><b>Cuerpo:</b> garganta cerrada, rodillas flojas, sonrisa que no llega a los ojos.</li><li><b>Acción:</b> lo que el personaje hace, evita o repite.</li><li><b>Objetos:</b> lo que sostiene, ordena o rompe.</li><li><b>Entorno:</b> cómo percibe el lugar según su ánimo.</li></ol><h3>La señal justa</h3><p>Una sola imagen exacta pesa más que cinco genéricas. Evita los gestos de manual (apretar los puños, suspirar) y busca el detalle que solo este personaje tendría.</p><h3>Cuándo nombrar</h3><p>Nombrar vale para emociones secundarias o transiciones rápidas. Reserva el mostrar para los momentos que importan.</p><blockquote>Si el lector lo deduce, lo siente suyo.</blockquote>`,{t:'Tristeza sin tristeza',d:'m',s:'Evoca una emoción con un objeto.',c:'En 120 palabras muestra la tristeza de un personaje usando solo un objeto y sus acciones, sin nombrar la emoción.'}),
MI('m6',11,'El conflicto interno: deseo vs necesidad','El motor más profundo del arco de personaje.',['personajes','tension y conflicto'],`<p>El motor más profundo de un personaje es la distancia entre lo que desea y lo que necesita. Cuando ambos chocan, nace el conflicto interno.</p><h3>Deseo y necesidad</h3><ol><li><b>Deseo:</b> lo consciente, concreto y perseguible (el ascenso, el amor, la venganza).</li><li><b>Necesidad:</b> lo que de verdad le falta, y a menudo ignora (perdón, pertenencia, verdad).</li><li><b>Mentira que cree:</b> la idea falsa que lo mantiene lejos de su necesidad.</li></ol><h3>Cómo dramatizarlo</h3><p>Pon al personaje ante una elección donde conseguir lo que quiere cuesta lo que necesita. Que cada opción tenga un precio real.</p><h3>El cambio</h3><p>El arco se completa cuando el personaje acepta su necesidad o la rechaza para siempre. Ambos finales son válidos; ninguno es neutral.</p><blockquote>El drama vive en la distancia entre querer y necesitar.</blockquote>`,{t:'Querer contra necesitar',d:'m',s:'Define el choque interno de un personaje.',c:'Escribe 150 palabras: qué quiere tu personaje, qué necesita y la escena en que debe elegir.'}),
MI('m7',10,'Métrica y musicalidad en la prosa','El oído del prosista: cadencia, repeticiones y silencios.',['estilo y voz','ritmo y pacing'],`<p>La prosa también suena. El oído del prosista detecta cadencias, repeticiones y silencios que el lector percibe aunque no sepa nombrarlos.</p><h3>Herramientas sonoras</h3><ol><li><b>Cadencia:</b> el ritmo de acentos y longitudes; frases que suben y bajan.</li><li><b>Repetición:</b> bien usada crea énfasis o hechizo; mal usada, torpeza.</li><li><b>Silencio:</b> el punto y aparte, la elipsis, el espacio en blanco.</li></ol><h3>Cuidado con</h3><p>Rimas involuntarias, cacofonías y tres «que» seguidos. Leer en voz alta las delata de inmediato.</p><h3>Ejercicio de oído</h3><p>Lee un párrafo que admires marcando dónde respira. Después reescribe uno tuyo imitando solo ese ritmo, no sus palabras.</p><blockquote>Si suena mal en voz alta, está mal en la página.</blockquote>`,{t:'Leer en voz alta',d:'f',s:'Afina el oído de tu prosa.',c:'Lee en voz alta un texto tuyo, marca tres frases que suenen torpes y reescríbelas.'}),
MI('m8',10,'Cierres memorables: cómo terminar una historia','Finales que resuelven y resuenan.',['estructura narrativa','tension y conflicto'],`<p>El final es lo último que el lector se lleva. Un buen cierre resuelve la pregunta central y deja una resonancia que dura después de la última línea.</p><h3>Tipos de cierre</h3><ol><li><b>Cerrado:</b> todo se resuelve; da satisfacción.</li><li><b>Abierto:</b> la pregunta queda flotando de forma deliberada.</li><li><b>Circular:</b> vuelve a la imagen del inicio, cambiada por lo vivido.</li></ol><h3>Qué lo vuelve inevitable</h3><p>El final debe sentirse sorprendente y a la vez inevitable: algo sembrado antes que ahora florece. Si el final necesita una explicación nueva, falló la siembra.</p><h3>Errores comunes</h3><p>Resolver todo con una casualidad, añadir moralejas o alargar la despedida. Termina cuando el cambio ya ocurrió.</p><blockquote>Un buen final no cierra la historia: cierra el cambio.</blockquote>`,{t:'Tres finales',d:'m',s:'Prueba cierres distintos.',c:'Escribe tres finales de 50 palabras para la misma historia: uno cerrado, uno abierto y uno circular.'}),
MI('m9',10,'El arte del flashback','Cuándo traer el pasado a escena y cómo hacerlo sin frenar el relato.',['estructura narrativa','ritmo y pacing'],`<p>El flashback interrumpe el presente para traer el pasado. Funciona cuando explica algo que el lector necesita justo ahora, y estorba cuando solo informa.</p><h3>Cuándo usarlo</h3><ol><li>Cuando una emoción presente solo se entiende con su origen.</li><li>Cuando el pasado contradice lo que el lector cree.</li><li>Cuando sostiene la tensión en lugar de detenerla.</li></ol><h3>Cómo entrar y salir</h3><p>Marca la entrada con un disparador (un olor, un objeto, una frase) y la salida con un ancla al presente. Cuida los tiempos verbales para que no se confunda la línea temporal.</p><h3>Alternativas</h3><p>Antes de escribir un flashback, intenta soltar el dato en un diálogo o en una reacción. Muchas veces basta una línea.</p><blockquote>El pasado entra en la historia solo cuando el presente lo reclama.</blockquote>`,{t:'Disparador',d:'m',s:'Entra y sal de un recuerdo.',c:'Escribe 150 palabras donde un objeto presente dispara un recuerdo breve y luego vuelve a la escena.'}),
MI('m10',10,'Descripción sensorial: más allá de la vista','Usar los cinco sentidos para sumergir al lector.',['descripcion y ambientacion'],`<p>La vista domina la escritura, pero el lector se sumerge cuando lo invitas a oír, oler, tocar y gustar. Los sentidos anclan el mundo en el cuerpo.</p><h3>Los cinco sentidos</h3><ol><li><b>Olfato:</b> el más ligado a la memoria; evoca lugares y épocas de golpe.</li><li><b>Oído:</b> ruidos de fondo, silencios, voces lejanas.</li><li><b>Tacto:</b> texturas, temperatura, peso.</li><li><b>Gusto:</b> poco usado y por eso potente.</li></ol><h3>Elegir, no acumular</h3><p>Dos o tres detalles precisos construyen una escena mejor que un inventario. Escoge los que el personaje notaría y los que sirven al ánimo.</p><h3>Sinestesia</h3><p>Mezclar sentidos («un silencio áspero») crea imágenes frescas, si no se abusa.</p><blockquote>Si el lector puede olerlo, ya está dentro.</blockquote>`,{t:'Una escena sin vista',d:'m',s:'Describe sin mirar.',c:'Describe una cocina en 120 palabras sin usar ningún detalle visual: solo oído, olfato, tacto y gusto.'}),
MI('m11',11,'Voces distintas: que cada personaje hable diferente','Cómo lograr que no se confundan los personajes al hablar.',['dialogos','personajes'],`<p>Si cubres los nombres y no distingues quién habla, los personajes suenan igual. La voz propia de cada uno es una de las marcas del buen diálogo.</p><h3>Qué define una voz</h3><ol><li><b>Vocabulario:</b> culto, coloquial, técnico, regional.</li><li><b>Sintaxis:</b> frases cortas y secas o largas y divagantes.</li><li><b>Tics:</b> muletillas, preguntas, ironía, silencios.</li><li><b>Lo que evita decir:</b> temas tabú y eufemismos.</li></ol><h3>Cómo construirlas</h3><p>Escribe una ficha de voz por personaje y haz el ejercicio de la misma frase: pídele a cada uno que pida un favor y compara.</p><h3>Sin caricatura</h3><p>Evita la fonética exagerada o un solo rasgo repetido. La voz se nota en el ritmo y la elección, no en el disfraz.</p><blockquote>Una voz se reconoce con los ojos cerrados.</blockquote>`,{t:'El mismo pedido',d:'m',s:'Haz sonar distintos a dos personajes.',c:'Escribe cómo dos personajes muy diferentes piden dinero prestado, en 60 palabras cada uno.'}),
MI('m12',11,'Antagonistas con sentido','Villanos que se sienten reales, no obstáculos de cartón.',['personajes','tension y conflicto'],`<p>Un buen antagonista no es un obstáculo: es alguien con deseos propios que choca con los del protagonista. Piensa que es el héroe de su propia historia.</p><h3>Qué lo hace creíble</h3><ol><li><b>Motivación clara:</b> quiere algo que el lector puede entender, aunque no compartir.</li><li><b>Lógica interna:</b> sus actos son coherentes con su visión del mundo.</li><li><b>Espejo del protagonista:</b> refleja lo que este podría llegar a ser.</li></ol><h3>Qué evitar</h3><p>La maldad sin causa, los monólogos explicativos y la crueldad gratuita. Un antagonista humano da más miedo que uno monstruoso.</p><h3>Escena útil</h3><p>Escribe una escena desde su punto de vista donde crea que hace lo correcto. Te mostrará su lógica.</p><blockquote>El mejor villano cree que tiene razón.</blockquote>`,{t:'Héroe de su historia',d:'d',s:'Defiende al antagonista.',c:'Escribe 150 palabras en primera persona donde un antagonista justifica sus actos como si fueran correctos.'}),
MI('m13',12,'Revisión y edición: la segunda versión','Cómo convertir un borrador en un texto sólido.',['gramatica y ortografia','estilo y voz'],`<p>Escribir es reescribir. La primera versión existe para que haya algo que mejorar; la calidad se construye en la revisión.</p><h3>Revisar por capas</h3><ol><li><b>Estructura:</b> ¿cada escena cambia algo? ¿hay partes que sobran?</li><li><b>Personajes y voz:</b> ¿son consistentes y distintos?</li><li><b>Frase y párrafo:</b> ritmo, claridad y repeticiones.</li><li><b>Corrección:</b> ortografía, puntuación y detalles.</li></ol><h3>Técnicas</h3><p>Deja reposar el texto unos días, léelo en voz alta, cambia el formato para verlo con ojos nuevos y recorta un diez por ciento.</p><h3>Cuidado</h3><p>No pulas las frases de una escena que quizá debas eliminar. Primero lo grande, después lo pequeño.</p><blockquote>Corta sin piedad lo que no sirve a la historia.</blockquote>`,{t:'Recorte del diez por ciento',d:'f',s:'Aprende a cortar.',c:'Toma un texto tuyo de 200 palabras y redúcelo a 180 sin perder nada importante.'}),
MI('m14',9,'Puntuación al servicio del ritmo','Cada signo decide dónde respira el lector.',['gramatica y ortografia','ritmo y pacing'],`<p>La puntuación es el ritmo escrito. Cada signo decide dónde respira el lector y qué peso tiene cada idea.</p><h3>Signos y efectos</h3><ol><li><b>Coma:</b> pausa breve; ordena y enumera.</li><li><b>Punto:</b> corte limpio; da fuerza a lo que cierra.</li><li><b>Punto y coma:</b> une ideas cercanas sin fundirlas.</li><li><b>Raya y dos puntos:</b> anuncian, aclaran o interrumpen.</li></ol><h3>Ritmo con puntuación</h3><p>Frases con muchas comas aceleran y atropellan; frases con puntos cortos golpean y desaceleran. Cambia la puntuación sin cambiar las palabras y escucha la diferencia.</p><h3>Regla práctica</h3><p>Puntúa para que el lector entienda a la primera. Si debe releer, falta un signo o sobra una idea.</p><blockquote>Un punto bien puesto vale por una frase.</blockquote>`,{t:'Misma frase, otro ritmo',d:'f',s:'Cambia el ritmo con signos.',c:'Escribe un párrafo de 80 palabras y reescríbelo cambiando solo la puntuación: primero para acelerarlo y luego para frenarlo.'}),
MI('m15',10,'Ambientación que respira: el lugar como personaje','Espacios que revelan, presionan y cambian a quien los habita.',['descripcion y ambientacion','worldbuilding'],`<p>El lugar no es un decorado: puede presionar, revelar y cambiar a los personajes. Una ambientación viva se vuelve casi un personaje más.</p><h3>Funciones del espacio</h3><ol><li><b>Atmósfera:</b> crea el clima emocional de la escena.</li><li><b>Carácter:</b> los espacios revelan a quien los habita.</li><li><b>Conflicto:</b> un lugar hostil o encerrado aumenta la tensión.</li></ol><h3>Cómo describir</h3><p>Filtra por el personaje: describe lo que le importa y lo que le molesta. Mezcla un detalle general con uno inesperado que lo vuelva único.</p><h3>Tiempo y época</h3><p>La hora, la estación y la época también ambientan. Un detalle bien elegido ubica sin necesidad de fechas.</p><blockquote>Dime dónde vives y te diré quién eres.</blockquote>`,{t:'El cuarto habla',d:'m',s:'Describe un lugar que revele a su dueño.',c:'Describe en 150 palabras la habitación de un personaje sin decir quién es: que el espacio lo revele.'})];

function relHTML(id){const r=(REL[id]||[]).map(k=>MC.find(m=>m.id===k)).filter(Boolean);return r.length?`<div class='sec-title'>Profundiza con microcursos</div><div class='mgrid'>`+r.map(m=>`<div class='mcard' data-m='${m.id}'><b>${m.t}</b><div class='m'>${m.d}</div></div>`).join('')+`</div>`:'';}
function renderMicro(){const done=MC.filter(m=>prog['mc_'+m.id]).length;
 document.getElementById('view').innerHTML=`<div class='m' style='color:var(--accent)'>Microcursos</div><h1 class='greet serif'>Estudia cada habilidad por separado</h1><p class='m' style='margin:-10px 0 16px'>Cada microcurso profundiza en una faceta concreta del oficio. Ideales para reforzar justo lo que necesitas.</p><div class='prog'><i style='width:${done/MC.length*100}%'></i></div><div class='sec-title'>${done} de ${MC.length} completados</div><div class='mgrid'>`+MC.map(m=>`<div class='mcard' data-m='${m.id}'><span class='chk ${prog['mc_'+m.id]?'on':''}' style='float:right'>${prog['mc_'+m.id]?'✓':''}</span><b class='serif' style='font-size:17px'>${m.t}</b><div class='m' style='margin:4px 0 8px'>${m.d}</div><div class='chipset'>${m.sk.map(k=>`<span class='tag'>${skl(k)}</span>`).join('')}<span class='tag'>${m.min} min</span></div></div>`).join('')+`</div>`;

function abrirMicro(id){const m=MC.find(x=>x.id===id),p=prog['mc_'+id],a=prog['ma_'+id];
